    <div class="doc-head" style="padding-top:0">${fld('Bằng chữ', `<input data-t="chu" value="${esc(docSo(t.tong) + ' chẵn.')}" readonly>`, 'full')}${fld('Ghi chú', inp('GhiChu', 'placeholder="Điều khoản bổ sung, ghi chú nội bộ"'), 'full')}</div></div>`;
  drawHDLines(el);

  el.onclick = run(async e => {
    const a = e.target.closest('[data-act]');
    if (!a) return;
    const b = S.hd;
    if (a.dataset.act === 'newkh') openKhach(null, pickHDKhach);
    else if (a.dataset.act === 'taofile') await taoFileHD();
    else if (a.dataset.act === 'pdf') await taiPdfHD();
    else if (a.dataset.act === 'addline') { b.lines.push(blankHDLine()); drawHDLines(el); focusCell(el, b.lines.length - 1, 'TenHang'); }
    else if (a.dataset.act === 'rm') { b.lines.splice(+a.dataset.i, 1); hdTail(); drawHDLines(el); drawHDTotals(el); setDirty(true); }
  });
  el.oninput = e => onHDInput(el, e.target);
}

// Đơn hàng của khách đã chọn (đơn đang gắn vào hợp đồng luôn có mặt trong danh sách)
function hdOrderOptions() {
  const d = S.hd, ds = S.donHang.filter(x => x.TrangThai !== 'Hủy' && ((d.MaKH && x.MaKH === d.MaKH) || x.SoDH === d.SoDH));
  return `<option value="">— Không gắn đơn hàng —</option>` + ds.map(x => `<option value="${esc(x.SoDH)}"${x.SoDH === d.SoDH ? ' selected' : ''}>${esc(x.SoDH)} · ${dmy(x.Ngay)} · ${money(x.TongCong)} ₫</option>`).join('');
}

function drawHDLines(el) {
  const ls = S.hd.lines, n = ls.length, khoa = !!S.extra.khoa, ro = khoa ? ' readonly' : '';
  $('tbody', el).innerHTML = ls.map((l, i) => `<tr data-i="${i}"><td class="c muted">${i + 1}</td>
    <td><input data-f="TenHang" value="${esc(l.TenHang)}" autocomplete="off"${ro}${i === n - 1 && !khoa ? ' placeholder="Gõ tên / model để tìm hàng…"' : ''} aria-label="Tên hàng dòng ${i + 1}"></td>
    <td><input data-f="DVT" value="${esc(l.DVT)}"${ro}></td>
    <td><input data-f="SoLuong" class="num" type="number" min="0" step="any" value="${esc(l.SoLuong)}"${ro}></td>
    <td><input data-f="DonGia" class="num money" inputmode="numeric" value="${money(l.DonGia)}"${ro} aria-label="Đơn giá dòng ${i + 1}"></td>
    <td class="c num" data-c="ThanhTien">${l.TenHang ? money(lineTotal(l)) : ''}</td>
    <td>${khoa ? '' : `<button class="icon-btn" data-act="rm" data-i="${i}" title="Xóa dòng" aria-label="Xóa dòng ${i + 1}">${icon('x')}</button>`}</td></tr>`).join('');
}
function drawHDTotals(el) {
  const t = hdTotal();
  $('[data-t="tien"]', el).textContent = money(t.tien) + ' ₫';
  $('[data-t="tienVat"]', el).textContent = money(t.tienVat) + ' ₫';
  $('[data-t="tong"]', el).textContent = money(t.tong) + ' ₫';
  $('[data-t="chu"]', el).value = docSo(t.tong) + ' chẵn.';
}

function onHDInput(el, t) {
  const d = S.hd;
  if (t.dataset.h) {
    d[t.dataset.h] = t.value;
    if (t.dataset.h === 'TenDN') {
      d.MaKH = ''; $('[data-ro="MaKH"]', el).textContent = 'Chưa chọn khách trong danh sách';
      showPicker(t, khachSource, pickHDKhach);
    }
    if (t.dataset.h === 'VAT') drawHDTotals(el);
    setDirty(true);
    return;
  }
  const tr = t.closest('tr[data-i]'), f = t.dataset.f;
  if (!tr || !f) return;
  const i = +tr.dataset.i, l = d.lines[i];
  if (f === 'DonGia') l.DonGia = parseMoney(t.value);
  else if (f === 'SoLuong') l.SoLuong = t.value === '' ? '' : +t.value;
  else l[f] = t.value;
  if (f === 'TenHang') {
    if (!t.value.trim()) l.MaHH = '';
    showPicker(t, hangSource, h => pickHDHang(i, h));
  }
  $('[data-c="ThanhTien"]', tr).textContent = l.TenHang ? money(lineTotal(l)) : '';
  drawHDTotals(el); setDirty(true);
}

function pickHDHang(i, h) {
  const l = S.hd.lines[i], el = $('#view'), gia = h.GiaSi !== '' ? h.GiaSi : h.GiaLe;
  Object.assign(l, { MaHH: h.MaHH, TenHang: h.TenHang, DVT: h.DVT, SoLuong: l.SoLuong || 1, DonGia: gia });
  if (gia === '') toast(`"${h.TenHang}" chưa có giá – hãy nhập đơn giá.`, 'err');
  hdTail(); drawHDLines(el); drawHDTotals(el); setDirty(true);
  focusCell(el, i, gia === '' ? 'DonGia' : 'SoLuong');
}

// Thông tin bên A lấy từ khách hàng (người đại diện lấy theo người đại diện, không có thì người liên hệ)
const benAKhach = kh => ({ MaKH: kh.MaKH, TenDN: kh.TenKH, DiaChi: kh.DiaChi || '', VanPhongGD: kh.VanPhongGD || '', MST: kh.MST || '', NguoiDaiDien: kh.NguoiDaiDien || kh.NguoiLienHe || '',
  ChucVu: kh.ChucVu || '', SDT: kh.SDT || '', SoTK: kh.SoTK || '', NganHang: kh.NganHang || '' });
function pickHDKhach(kh) {
  const d = S.hd, el = $('#view');
  Object.assign(d, benAKhach(kh));
  if (!S.donHang.some(x => x.SoDH === d.SoDH && x.MaKH === kh.MaKH)) d.SoDH = '';
  el.querySelectorAll('input[data-h]').forEach(i => { i.value = d[i.dataset.h] ?? ''; });
  $('select[data-h="SoDH"]', el).innerHTML = hdOrderOptions();
  $('[data-ro="MaKH"]', el).textContent = 'Mã khách: ' + kh.MaKH;
  setDirty(true);
}

// Lập hợp đồng từ đơn hàng đã lưu: chép khách, VAT và các dòng hàng
async function hdTuDon(dh) {
  if (S.dirty) throw new Error('Lưu đơn hàng trước khi lập hợp đồng.');
  const co = S.hopDong.filter(h => h.SoDH === dh.SoDH);
  if (co.length && !confirm(`Đơn ${dh.SoDH} đã có hợp đồng ${co.map(h => h.SoHD).join(', ')}. Vẫn lập thêm hợp đồng mới?`)) return;
  const kh = S.khach.find(x => x.MaKH === dh.MaKH);
  const ben = kh ? benAKhach(kh) : { MaKH: dh.MaKH || '', TenDN: dh.TenKH, DiaChi: dh.DiaChi || '', SDT: dh.SDT || '', NguoiDaiDien: dh.NguoiNhan || '' };
  if (newHD(Object.assign(ben, { SoDH: dh.SoDH, VAT: dh.VAT, lines: filled(dh.lines).map(l => ({ MaHH: l.MaHH, TenHang: l.TenHang, DVT: l.DVT, SoLuong: l.SoLuong, DonGia: l.DonGia })) }))) {
    setDirty(true);
    toast(`Đã chép khách và hàng từ đơn ${dh.SoDH}. Chọn loại hợp đồng, kiểm tra rồi bấm Lưu.`);
  }
}

// Nhân bản: bản sao chưa lưu của hợp đồng đang mở (đổi loại hợp đồng ở bước 1 nếu muốn dùng mẫu khác)
function nhanBanHD() {
  const b = S.hd;
  if (S.dirty) throw new Error('Lưu hợp đồng trước khi nhân bản.');
  if (editHD(Object.assign({}, b, { SoHD: '', FileId: '', LinkFile: '', NgayFile: '', FileCu: '', NguoiTao: '', NgayTao: '', NgaySua: '', TrangThai: 'Soạn thảo', Ngay: today(), NgayHieuLuc: '', NgayHetHan: '',
    lines: filled(b.lines).map(l => ({ MaHH: l.MaHH, TenHang: l.TenHang, DVT: l.DVT, SoLuong: l.SoLuong, DonGia: l.DonGia })) }))) {
    setDirty(true);
    toast('Đã tạo bản sao: sửa rồi bấm Lưu để có số hợp đồng mới.');
  }
}

// Tạo hàng loạt: chọn nhiều hợp đồng nguồn + một loại hợp đồng mới, tạo lần lượt từng cái (mỗi cái một lần gọi máy chủ, lỗi cái nào báo cái đó)
function openHDHangLoat() {
  const sel = new Set(), TOI_DA = 20;
  const m = modal({
    title: 'Tạo hợp đồng hàng loạt', wide: true,
    body: `<p class="muted" style="margin-top:0">Chọn các hợp đồng có sẵn làm nguồn: mỗi hợp đồng được chép (bên A, hàng hóa, VAT) thành một hợp đồng mới thuộc loại bạn chọn, ngày ký là hôm nay, ngày hiệu lực và hết hạn để trống. Mỗi lần tối đa ${TOI_DA} hợp đồng.</p>
      <label class="field"><span class="lb">Hợp đồng nguồn (chọn nhiều)</span><input type="search" data-q placeholder="Tìm số hợp đồng, khách hàng, loại hợp đồng…"></label>
      <div style="display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap"><button class="btn sm" data-all>Chọn tất cả</button><button class="btn sm" data-none>Bỏ chọn</button><span class="muted">Đã chọn: <b data-n>0</b></span></div>
      <div data-list class="tbl-wrap" style="max-height:250px;padding:4px 8px"></div>
      <div class="fgrid" style="margin-top:12px"><label class="field"><span class="lb">Loại hợp đồng mới (chung cho tất cả)</span><select name="loai">${loaiHDAll().map(x => `<option>${esc(x)}</option>`).join('')}</select></label>
      <label class="check" style="align-self:end;padding-bottom:8px"><input type="checkbox" name="taofile" checked><b>Tạo luôn file Google Docs</b></label></div>
      <div data-kq style="margin-top:10px"></div>`,
    buttons: [{ t: 'Tạo hàng loạt', ic: 'plus', cls: 'primary', fn: run(chay) }],
  });
  const q = $('[data-q]', m), list = $('[data-list]', m);
  const hien = () => {
    const w = words(q.value), ds = S.hopDong.filter(h => matches(w, h, hdText));
    list.innerHTML = ds.length ? ds.slice(0, 200).map(h => `<label class="check" style="display:flex;gap:8px;padding:5px 2px"><input type="checkbox" data-so="${esc(h.SoHD)}"${sel.has(h.SoHD) ? ' checked' : ''}>
      <span><b>${esc(h.SoHD)}</b> · ${esc(h.TenDN)}<span class="sub">${esc(h.LoaiHD)} · ${money(h.TongCong)} ₫</span></span></label>`).join('') : '<p class="muted">Không có hợp đồng phù hợp.</p>';
    $('[data-n]', m).textContent = sel.size;
  };
  q.oninput = hien;
  list.onchange = e => { const c = e.target.closest('[data-so]'); if (c) { c.checked ? sel.add(c.dataset.so) : sel.delete(c.dataset.so); hien(); } };
  $('[data-all]', m).onclick = () => { list.querySelectorAll('[data-so]').forEach(c => sel.add(c.dataset.so)); hien(); };
  $('[data-none]', m).onclick = () => { sel.clear(); hien(); };
  hien();
  async function chay() {
    const ds = [...sel];
    if (!ds.length) throw new Error('Chọn ít nhất 1 hợp đồng nguồn.');
    if (ds.length > TOI_DA) throw new Error(`Mỗi lần tối đa ${TOI_DA} hợp đồng. Bỏ bớt ${ds.length - TOI_DA} hợp đồng.`);
    const loai = $('[name=loai]', m).value, taoFile = $('[name=taofile]', m).checked, kq = $('[data-kq]', m);
    kq.innerHTML = '';
    let ok = 0;
    for (const so of ds) {
      const dong = document.createElement('div');
      dong.textContent = `… ${so}: đang tạo`; kq.append(dong);
      try {
        const r = await api('nhanBanHopDong', so, loai, taoFile);
        upsertLocal('hopDong', 'SoHD', r.doc); ok++;
        dong.innerHTML = `<span class="green">✔</span> ${esc(so)} → <b>${esc(r.doc.SoHD)}</b>${r.loiFile ? ` <span class="warn">(chưa tạo được file: ${esc(r.loiFile)})</span>` : r.conSot && r.conSot.length ? ` <span class="warn">(mẫu còn biến lạ: ${esc(r.conSot.join(', '))})</span>` : ''}`;
      } catch (e) { dong.innerHTML = `<span class="red">✘</span> ${esc(so)}: ${esc(errMsg(e))}`; }
      if (!document.body.contains(kq)) break; // đã đóng hộp thoại: dừng
    }
    sortAll(); render();
    if (document.body.contains(kq)) kq.insertAdjacentHTML('afterbegin', `<p><b>Xong: tạo được ${ok}/${ds.length} hợp đồng.</b></p>`);
    toast(`Đã tạo ${ok}/${ds.length} hợp đồng.`, ok === ds.length ? '' : 'err');
  }
}

async function saveHD() {
  if (saving) return;
  const d = Object.assign({}, S.hd), lines = d.lines.filter(l => String(l.TenHang).trim());
  if (!d.LoaiHD) throw new Error('Chọn loại hợp đồng.');
  if (!String(d.TenDN).trim()) throw new Error('Nhập tên khách hàng (bên A).');
  if (lines.some(l => !(+l.SoLuong > 0))) throw new Error('Nhập số lượng lớn hơn 0 cho mọi dòng hàng.');
  if (d.NgayHieuLuc && d.NgayHetHan && d.NgayHetHan < d.NgayHieuLuc) throw new Error('Ngày hết hạn phải sau ngày hiệu lực.');
  if (lines.some(l => l.DonGia === '' || l.DonGia == null) && !confirm('Có dòng chưa có đơn giá (sẽ tính 0 ₫). Vẫn lưu?')) return;
  saving = true;
  try {
    // Khách chưa có trong danh sách: thêm để lần sau tự điền; khách có rồi mà thiếu thông tin bên A: bổ sung chỗ còn trống
    const benA = { NguoiLienHe: d.NguoiDaiDien, SDT: d.SDT, DiaChi: d.DiaChi, MST: d.MST, NguoiDaiDien: d.NguoiDaiDien, ChucVu: d.ChucVu, VanPhongGD: d.VanPhongGD, SoTK: d.SoTK, NganHang: d.NganHang };
    if (!d.MaKH) {
      if (confirm(`Khách "${d.TenDN}" chưa có trong danh sách khách hàng. Thêm vào danh sách?`)) {
        const kh = await api('luuKhach', Object.assign({ TenKH: d.TenDN }, benA));
        upsertLocal('khach', 'MaKH', kh); d.MaKH = S.hd.MaKH = kh.MaKH;
      }
    } else {
      const kh = S.khach.find(x => x.MaKH === d.MaKH), them = {};
      if (kh) ['SDT', 'DiaChi', 'MST', 'NguoiDaiDien', 'ChucVu', 'VanPhongGD', 'SoTK', 'NganHang'].forEach(k => { if (!String(kh[k] || '').trim() && String(benA[k] || '').trim()) them[k] = benA[k]; });
      if (kh && Object.keys(them).length && confirm(`Lưu thêm thông tin vừa nhập vào khách hàng "${kh.TenKH}" để lần sau tự điền?`)) upsertLocal('khach', 'MaKH', await api('luuKhach', Object.assign({}, kh, them)));
    }
    const r = await api('luuHopDong', Object.assign({}, d, { lines }));
    const head = Object.assign({}, r.doc); delete head.lines;
    upsertLocal('hopDong', 'SoHD', head); sortAll();
    S.hd = Object.assign({}, head, { lines: r.doc.lines.map(l => Object.assign({}, l)) });
    S.extra = { khoa: HD_DA_KY.includes(head.TrangThai) && !isAdmin() };
    S.dirty = false; hdTail();
    render();
    toast(`Đã lưu hợp đồng ${head.SoHD}.`);
  } finally { saving = false; }
}

// Tạo (hoặc tạo lại) file Google Docs từ mẫu; chưa lưu thì lưu trước
async function taoFileHD(khongHoi) {
  if (!S.hd.SoHD || S.dirty) { await saveHD(); if (!S.hd.SoHD || S.dirty) return; }
  if (S.hd.FileId && !khongHoi && S.hd.FileCu !== '1' && !confirm('Tạo lại sẽ thay file hiện có (file cũ chuyển vào thùng rác Google Drive). Tiếp tục?')) return;
  const r = await api('taoFileHopDong', S.hd.SoHD);
  const head = Object.assign({}, r.doc); delete head.lines;
  upsertLocal('hopDong', 'SoHD', head);
  Object.assign(S.hd, { FileId: head.FileId, LinkFile: head.LinkFile, NgayFile: head.NgayFile, FileCu: head.FileCu });
  render();
  toast('Đã tạo file hợp đồng ' + head.SoHD + '.');
  if (r.conSot.length) toast('Mẫu còn biến chưa nhận ra, giữ nguyên trong file: ' + r.conSot.join(', ') + '. Sửa file mẫu rồi tạo lại.', 'err');
}
// Tải PDF luôn khớp nội dung mới nhất: chưa có file hoặc file đã cũ thì tạo lại trước
async function taiPdfHD() {
  if (!S.hd.SoHD || S.dirty) { await saveHD(); if (!S.hd.SoHD || S.dirty) return; }
  if (!S.hd.FileId || S.hd.FileCu === '1') await taoFileHD(true);
  const r = await api('taiPdfHopDong', S.hd.SoHD);
  const url = URL.createObjectURL(new Blob([Uint8Array.from(atob(r.base64), c => c.charCodeAt(0))], { type: 'application/pdf' }));
  const a = document.createElement('a');
  a.href = url; a.download = r.ten; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast('Đã tải ' + r.ten);
}

async function delHD() {
  const so = S.hd.SoHD;
  if (!confirm(`Xóa hợp đồng ${so}? Không thể hoàn tác.`)) return;
  await api('xoaHopDong', so);
  S.hopDong = S.hopDong.filter(x => x.SoHD !== so);
  S.dirty = false; go('hopdong');
  toast(`Đã xóa hợp đồng ${so}.`);
}

// ===================== Bảo hành: tra theo IMEI/serial, SĐT, tên khách =====================
function vBaoHanh(el) {
  setTop('Bán hàng', 'Tra cứu bảo hành');
  const now = today();
  const conLai = r => Math.round((Date.parse(r.HetHan) - Date.parse(now)) / 864e5);
  const refresh = listCard(el, {
    id: 'baohanh', ph: 'Tìm IMEI / serial, SĐT, tên khách, tên máy…',
    filters: [{ id: 'tt', options: [['', 'Tất cả hàng đã giao'], ['con', 'Còn bảo hành'], ['het', 'Hết / không bảo hành']] }, { id: 'ngay', type: 'dates' }],
    filter: (r, f) => (!f.tt || (f.tt === 'con') === (!!r.HetHan && r.HetHan >= now)) && inRange(r.Ngay, f, 'ngay'),
    cols: [
      { t: 'Ngày giao', f: r => dmy(r.Ngay) },
      { t: 'Khách hàng', cls: 'wrap', f: r => `<b>${esc(r.TenKH)}</b><span class="sub">${esc(r.SDT)}</span>` },
      { t: 'Hàng hóa', cls: 'wrap', f: r => `${esc(r.TenHang)}<span class="sub">${esc(r.Model)}</span>` },
      { t: 'IMEI / Serial', f: r => r.IMEI ? `<span class="code">${esc(r.IMEI)}</span>` : `<span class="muted">${money(r.SoLuong)} ${esc(r.DVT)} · không ghi mã</span>` },
      { t: 'Bảo hành đến', f: r => r.HetHan ? dmy(r.HetHan) : '<span class="muted">—</span>' },
      { t: 'Tình trạng', f: r => !r.HetHan ? badge('Không bảo hành', 'b-gray') : r.HetHan < now ? badge('Hết hạn', 'b-red') : badge('Còn ' + conLai(r) + ' ngày', conLai(r) <= 30 ? 'b-amber' : 'b-green') },
      { t: 'Chứng từ', f: r => `${esc(r.SoPK)}${r.SoDH ? `<span class="sub">Đơn ${esc(r.SoDH)}</span>` : ''}` },
    ],
    data: () => S.baoHanh || [],
    text: r => [r.IMEI, r.TenKH, r.SDT, digits(r.SDT), r.MaKH, r.TenHang, r.Model, r.SoPK, r.SoDH].join(' '),
    open: run(r => openPK(S.phieuKho.find(p => p.SoPK === r.SoPK))),
    foot: rows => `<span>${rows.length} dòng</span><span>Còn bảo hành <b class="green">${rows.filter(r => r.HetHan && r.HetHan >= now).length}</b></span>`,
  });
  el.insertAdjacentHTML('beforeend', '<p class="muted" style="margin-top:14px">Danh sách lấy từ các phiếu xuất kho / giao hàng. Ghi IMEI hoặc serial ở cột IMEI khi giao hàng để tra được từng máy. Hạn bảo hành = ngày giao + số tháng bảo hành của mặt hàng (để trống thì theo cửa hàng).</p>');
  api('dsBaoHanh').then(rs => {
    // mỗi IMEI một dòng; hàng không ghi IMEI giữ một dòng theo số lượng
    S.baoHanh = rs.flatMap(r => r.IMEI ? r.IMEI.split(', ').map(x => Object.assign({}, r, { IMEI: x, SoLuong: 1 })) : [r]).sort(byDate);
    if (S.view === 'baohanh') refresh();
  }).catch(e => toast(errMsg(e), 'err'));
}

// ===================== Báo cáo doanh thu, sổ doanh thu theo mẫu S1a-HKD (Thông tư 152/2025/TT-BTC) =====================
function downloadCsv(name, head, rows) {
  // chuỗi bắt đầu bằng = + - @ thêm dấu ' để Excel không hiểu thành công thức
  const cell = v => '"' + (typeof v === 'string' && /^[=+\-@]/.test(v) ? "'" + v : String(v ?? '')).replace(/"/g, '""') + '"';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + [head, ...rows].map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function vBaoCao(el) {
  const t = today(), d0 = new Date(), y = d0.getFullYear(), mo = d0.getMonth();
  const st = S.q.baocao || (S.q.baocao = { from: t.slice(0, 8) + '01', to: t, tab: 'ngay' });
  const KY = {
    thang: () => ({ from: iso(new Date(y, mo, 1)), to: t }), truoc: () => ({ from: iso(new Date(y, mo - 1, 1)), to: iso(new Date(y, mo, 0)) }),
    quy: () => ({ from: iso(new Date(y, mo - mo % 3, 1)), to: t }), nam: () => ({ from: y + '-01-01', to: t }),
  };
  const dh = S.donHang.filter(d => d.TrangThai !== 'Hủy' && d.Ngay >= st.from && d.Ngay <= st.to);
  const pt = S.thuTien.filter(p => p.Ngay >= st.from && p.Ngay <= st.to);
  // Gộp đơn hàng (doanh thu) và phiếu thu (tiền đã thu) theo một khóa: ngày, nhân viên hoặc khách
  const gop = (kDH, kPT, ten) => {
    const m = {};
    const row = k => m[k] || (m[k] = { k, ten: ten ? ten(k) : k, don: 0, ds: 0, thu: 0 });
    dh.forEach(d => { const r = row(kDH(d)); r.don++; r.ds += +d.TongCong || 0; });
    pt.forEach(p => { row(kPT(p)).thu += +p.SoTien || 0; });
    return Object.values(m);
  };
  const TABS = {
    ngay: ['Theo ngày', 'Ngày', () => gop(d => d.Ngay, p => p.Ngay).sort((a, b) => String(a.k).localeCompare(String(b.k)))],
    nv: ['Theo nhân viên', 'Nhân viên', () => gop(d => d.NguoiTao || '—', p => p.NguoiTao || '—').sort((a, b) => b.ds - a.ds)],
    kh: ['Theo khách hàng', 'Khách hàng', () => gop(d => d.MaKH, p => p.MaKH, ma => (S.khach.find(k => k.MaKH === ma) || { TenKH: ma }).TenKH).sort((a, b) => b.ds - a.ds)],
    hang: ['Theo mặt hàng', 'Mặt hàng'],
  };
  let head, body, csv, empty = 'Không có đơn hàng hay phiếu thu trong kỳ.';
  if (st.tab === 'hang') {
    const key = st.from + '|' + st.to;
    if (!st.hang || st.hang.key !== key) {
      const h = st.hang = { key, data: null };
      api('baoCaoHang', st.from, st.to).then(r => { h.data = r.topHang; }).catch(e => { h.data = []; toast(errMsg(e), 'err'); })
        .then(() => { if (S.view === 'baocao' && st.hang === h) render(); });
    }
    const rs = st.hang.data || [];
    if (!st.hang.data) empty = 'Đang tải…';
    head = [['Mặt hàng'], ['Nhóm hàng'], ['Số lượng', 'num'], ['Doanh số (chưa VAT)', 'num']];
    body = rs.map(r => [`<b>${esc(r.TenHang)}</b>`, esc(r.Nhom), money(r.SoLuong) + ' ' + esc(r.DVT), money(r.ThanhTien)]);
    csv = rs.map(r => [r.TenHang, r.Nhom, r.SoLuong, r.ThanhTien]);
  } else {
    const rs = TABS[st.tab][2]();
    head = [[TABS[st.tab][1]], ['Số đơn', 'num'], ['Doanh thu', 'num'], ['Đã thu', 'num']];
    body = rs.map(r => [st.tab === 'ngay' ? dmy(r.k) : `<b>${esc(r.ten)}</b>`, r.don, money(r.ds), money(r.thu)]);
    csv = rs.map(r => [st.tab === 'ngay' ? r.k : r.ten, r.don, r.ds, r.thu]);
  }
  setTop('Báo cáo', 'Doanh thu & sổ doanh thu', [
    { t: 'In sổ doanh thu (S1a-HKD)', ic: 'print', cls: 'primary', fn: run(() => printHtml(soDoanhThuHtml(st, dh))) },
    { t: 'Xuất CSV', ic: 'download', fn: () => downloadCsv(`bao-cao-${st.tab}-${st.from}_${st.to}.csv`, head.map(h => h[0]), csv) },
  ]);
  const dsTong = sum(dh, d => d.TongCong);
  const stat = (l, v, cls = '') => `<div class="stat"><div class="l">${l}</div><div class="v ${cls}">${v}</div></div>`;
  el.innerHTML = `<div class="card" style="margin-bottom:16px">
    <div class="rpt-bar"><b>Kỳ báo cáo</b><input type="date" data-k="from" value="${esc(st.from)}" aria-label="Từ ngày"><span class="muted">→</span><input type="date" data-k="to" value="${esc(st.to)}" aria-label="Đến ngày">
      ${[['thang', 'Tháng này'], ['truoc', 'Tháng trước'], ['quy', 'Quý này'], ['nam', 'Năm nay']].map(([k, l]) => `<button class="btn sm" data-ky="${k}">${l}</button>`).join('')}</div>
    <div class="card-b" style="padding-top:0"><div class="stats" style="margin-top:0">
      ${stat('Doanh thu (gồm thuế GTGT)', money(dsTong) + ' ₫')}${stat('Số đơn hàng', dh.length)}${stat('Trung bình mỗi đơn', money(dh.length ? dsTong / dh.length : 0) + ' ₫')}${stat('Tiền đã thu trong kỳ', money(sum(pt, p => p.SoTien)) + ' ₫', 'green')}</div>
      <p class="muted" style="margin:10px 0 0">Doanh thu tính theo ngày lập đơn, không gồm đơn đã hủy. Sổ doanh thu in theo mẫu S1a-HKD (Thông tư 152/2025/TT-BTC) cho hộ kinh doanh, mỗi ngày một dòng; tên chủ hộ và mã số thuế điền ở Cài đặt.</p></div></div>
    <div class="seg" role="tablist">${Object.keys(TABS).map(k => `<button data-tab="${k}" class="${st.tab === k ? 'on' : ''}">${TABS[k][0]}</button>`).join('')}</div>
    <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h => `<th class="${h[1] || ''}">${h[0]}</th>`).join('')}</tr></thead>
      <tbody>${body.map(r => `<tr>${r.map((c, i) => `<td class="${head[i][1] || ''}">${c}</td>`).join('')}</tr>`).join('') || `<tr><td class="empty" colspan="${head.length}">${empty}</td></tr>`}</tbody></table></div></div>`;
  el.onclick = e => {
    const tb = e.target.closest('[data-tab]'), ky = e.target.closest('[data-ky]');
    if (tb) { st.tab = tb.dataset.tab; render(); }
    if (ky) { Object.assign(st, KY[ky.dataset.ky]()); render(); }
  };
  el.onchange = e => {
    const k = e.target.dataset.k;
    if (!k || !e.target.value) return;
    st[k] = e.target.value;
    if (st.from > st.to) st[k === 'from' ? 'to' : 'from'] = st[k];
    render();
  };
}

// Sổ doanh thu bán hàng hóa, dịch vụ: ngày – diễn giải – số tiền, mỗi ngày có đơn một dòng (mẫu cho phép ghi gộp theo ngày)

  const c = S.congTy, t = today(), ngay = {};
  dh.forEach(d => { const r = ngay[d.Ngay] || (ngay[d.Ngay] = { n: 0, tien: 0 }); r.n++; r.tien += +d.TongCong || 0; });
  const dc = (c.diaChi || [])[0] || '';
  return `<div class="p-page">
    <div class="p-form"><div><div><b>HỘ, CÁ NHÂN KINH DOANH:</b> ${esc(c.chuHo || c.ten)}</div><div><b>Địa chỉ:</b> ${esc(dc)}</div><div><b>Mã số thuế:</b> ${esc(c.mst)}</div></div>
      <div class="r"><b>Mẫu số S1a-HKD</b><br><i>(Kèm theo Thông tư số 152/2025/TT-BTC ngày 31 tháng 12 năm 2025 của Bộ trưởng Bộ Tài chính)</i></div></div>
    <h1>SỔ DOANH THU BÁN HÀNG HÓA, DỊCH VỤ</h1>
    <div style="text-align:center">Địa điểm kinh doanh: ${esc(dc)}<br>Kỳ kê khai: từ ngày ${dmy(st.from)} đến ngày ${dmy(st.to)}</div>
    <div style="text-align:right"><i>Đơn vị tính: đồng</i></div>
    <table class="p-lines"><thead><tr><th style="width:22%">Ngày tháng</th><th>Diễn giải</th><th style="width:26%">Số tiền</th></tr><tr><th>A</th><th>B</th><th>1</th></tr></thead>
    <tbody>${Object.keys(ngay).sort().map(k => `<tr><td style="text-align:center">${dmy(k)}</td><td>Doanh thu bán hàng hóa, dịch vụ trong ngày (${ngay[k].n} đơn hàng)</td><td class="num">${money(ngay[k].tien)}</td></tr>`).join('')
      || '<tr><td colspan="3" style="text-align:center">Không phát sinh doanh thu trong kỳ</td></tr>'}</tbody>
    <tfoot><tr><td></td><td>Tổng cộng</td><td class="num">${money(sum(dh, d => d.TongCong))}</td></tr></tfoot></table>
    <div class="p-sign"><div style="flex:0 0 320px;margin-left:auto"><i>Ngày ${t.slice(8)} tháng ${t.slice(5, 7)} năm ${t.slice(0, 4)}</i>NGƯỜI ĐẠI DIỆN HỘ KINH DOANH/<br>CÁ NHÂN KINH DOANH<i>(Ký, họ tên, đóng dấu)</i></div></div></div>`;
}

function vTaiKhoan(el) {
  setTop('Hệ thống', 'Tài khoản đăng nhập', [{ t: 'Thêm tài khoản', ic: 'plus', cls: 'primary', fn: () => openTaiKhoan() }]);
  S.onNew = () => openTaiKhoan();
  const refresh = listCard(el, {
    id: 'taikhoan', ph: 'Tìm tài khoản…',
    cols: [
      { t: 'Tên đăng nhập', k: 'TenDangNhap', cls: 'code' }, { t: 'Họ tên', k: 'HoTen' },
      { t: 'Vai trò', f: r => r.VaiTro === 'admin' ? badge('Quản trị', 'b-violet') : badge('Nhân viên', 'b-blue') },
      { t: 'Cửa hàng', f: r => esc(String(r.CuaHang || '').split(',').map(id => (S.dsCuaHang.find(x => x.id === id) || { ten: id }).ten).join(', ')) },
      { t: 'Trạng thái', f: r => r.TrangThai === 'Khóa' ? badge('Khóa', 'b-gray') : badge('Hoạt động', 'b-green') }, { t: 'Ngày tạo', f: r => dmy(r.NgayTao) },
    ],
    data: () => S.taiKhoan || [], text: r => [r.TenDangNhap, r.HoTen].join(' '), open: r => openTaiKhoan(r),
  });
  el.insertAdjacentHTML('beforeend', `<p class="muted" style="margin-top:14px">Nhân viên: xem mọi thứ, thêm/sửa khách hàng, báo giá, đơn hàng, phiếu kho, phiếu thu. Quản trị: thêm sửa bảng giá, xóa dữ liệu, quản lý tài khoản.</p>`);
  if (!S.taiKhoan) api('dsTaiKhoan').then(r => { S.taiKhoan = r; if (S.view === 'taikhoan') refresh(); }).catch(e => toast(errMsg(e), 'err'));
}

function openTaiKhoan(tk) {
  const isNew = !tk; tk = tk || { VaiTro: 'nhanvien', TrangThai: 'Hoạt động', CuaHang: S.cuaHang.id };
  const cur = String(tk.CuaHang || '').split(',');
  modal({
    title: isNew ? 'Thêm tài khoản' : `Tài khoản ${tk.TenDangNhap}`,
    body: formHtml([
      ['TenDangNhap', 'Tên đăng nhập *', { ro: !isNew, ph: 'vd: lan.nguyen (không dấu)' }], ['HoTen', 'Họ tên'],
      ['VaiTro', 'Vai trò', { options: [['nhanvien', 'Nhân viên'], ['admin', 'Quản trị']] }],
      ['TrangThai', 'Trạng thái', { options: ['Hoạt động', 'Khóa'] }],
      ['MatKhau', isNew ? 'Mật khẩu *' : 'Mật khẩu mới', { type: 'password', ph: isNew ? 'Tối thiểu 6 ký tự' : 'Để trống nếu không đổi', full: true }],
    ], tk) + `<div class="field" style="margin-top:14px"><span class="lb">Cửa hàng được vào</span><div class="checks">${S.dsCuaHang.map(x =>
      `<label class="check"><input type="checkbox" name="shop_${esc(x.id)}"${cur.includes(x.id) ? ' checked' : ''}><b>${esc(x.ten)}</b><span class="muted">– ${esc(x.moTa)}</span></label>`).join('')}</div></div>`,
    buttons: [{ t: 'Lưu (F8)', ic: 'save', cls: 'primary', save: true, fn: run(async m => {
      const d = formData(m); d.moi = isNew;
      d.CuaHang = S.dsCuaHang.filter(x => d['shop_' + x.id]).map(x => x.id).join(',');
      const saved = await api('luuTaiKhoan', d);
      const i = S.taiKhoan.findIndex(x => x.TenDangNhap === saved.TenDangNhap);
      if (i >= 0) S.taiKhoan[i] = saved; else S.taiKhoan.push(saved);
      closeModal(); render(); toast(`Đã lưu tài khoản ${saved.TenDangNhap}.`);
    }) }],
  });
}

// Mẫu hợp đồng (quản trị): mỗi loại hợp đồng một file Google Docs mẫu
function mauHDCard() {
  const rows = S.mauHD.map((m, i) => `<tr><td><b>${esc(m.LoaiHD)}</b><span class="sub">${esc(m.MoTa)}</span></td>
    <td><a class="more" href="${esc(m.LinkMau)}" target="_blank" rel="noopener">Mở file mẫu</a></td><td class="num"><a class="more" data-act="mau-sua" data-i="${i}">Sửa</a> · <a class="more" data-act="mau-xoa" data-i="${i}">Xóa</a></td></tr>`).join('');
  return `<div class="card" style="margin-top:16px"><div class="card-h"><h3>Mẫu hợp đồng (Google Docs)</h3><a class="more" data-act="mau-bien">Danh sách biến</a></div><div class="card-b">
    <p class="muted" style="margin-top:0">Mỗi loại hợp đồng là một file Google Docs mẫu: sửa nội dung và điều khoản ngay trong file. Khi tạo hợp đồng, app chép file mẫu rồi thay các biến như {{TENDOANHNGHIEP}}. File mẫu và hợp đồng nằm trong thư mục "Hợp đồng - tên cửa hàng" trên Google Drive của chủ script. Bộ mẫu mặc định chỉ là khung tham khảo, nên nhờ luật sư rà soát trước khi dùng.</p>
    ${rows ? `<table class="mini">${rows}</table>` : '<p class="muted">Chưa có mẫu nào. Bấm "Tạo lại mẫu mặc định".</p>'}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sm" data-act="mau-them">${icon('plus')}Thêm loại hợp đồng</button><button class="btn sm" data-act="mau-macdinh">${icon('refresh')}Tạo lại mẫu mặc định</button></div>
  </div></div>`;
}
async function mauHDAct(a) {
  const act = a.dataset.act, m = S.mauHD[+a.dataset.i];
  const nhan = r => { S.mauHD = r.mauHD; S.loaiHD = r.loaiHD; render(); };
  if (act === 'mau-them' || act === 'mau-sua') {
    modal({
      title: m ? 'Sửa mẫu: ' + m.LoaiHD : 'Thêm loại hợp đồng',
      body: formHtml([['LoaiHD', 'Tên loại hợp đồng *', { ro: !!m, full: true }], ['LinkMau', 'Link file Google Docs mẫu *', { full: true, ph: 'https:/' + '/docs.google.com/document/d/…' }], ['MoTa', 'Mô tả ngắn', { full: true }]], m || {})
        + '<p class="muted">Tài khoản Google chạy script phải mở được file này (file của chính chủ script thì được). Không dùng file Word .docx: mở bằng Google Docs rồi chọn Tệp → Lưu dưới dạng Google Docs.</p>',
      buttons: [{ t: 'Lưu (F8)', ic: 'save', cls: 'primary', save: true, fn: run(async mm => { nhan(await api('luuMauHopDong', formData(mm))); closeModal(); toast('Đã lưu mẫu hợp đồng.'); }) }],
    });
  } else if (act === 'mau-xoa') {
    if (!confirm(`Xóa mẫu "${m.LoaiHD}"? File Google Docs vẫn còn trong Drive; các hợp đồng đã tạo không đổi.`)) return;
    nhan(await api('xoaMauHopDong', m.LoaiHD)); toast('Đã xóa mẫu.');
  } else if (act === 'mau-macdinh') {
    const r = await api('taoMauMacDinh');
    nhan(r); toast(r.moi.length ? 'Đã tạo ' + r.moi.length + ' mẫu: ' + r.moi.join(', ') + '.' : 'Đã đủ mẫu mặc định, không tạo thêm.');
  } else if (act === 'mau-bien') {
    const ds = await api('bienHopDongMau');
    const mm = modal({ title: 'Biến dùng trong file mẫu', wide: true,
      body: '<p class="muted" style="margin-top:0">Gõ đúng như bên dưới (chữ hoa, hai dấu ngoặc nhọn) vào file Google Docs mẫu. Bấm vào biến để sao chép. Biến chưa có dữ liệu sẽ in dấu chấm để điền tay.</p><div class="tbl-wrap" style="max-height:440px"><table class="tbl"><thead><tr><th>Biến</th><th>Nội dung</th></tr></thead><tbody>'
        + ds.map(b => `<tr><td><code class="code" data-copy="{{${esc(b[0])}}}" style="cursor:copy">{{${esc(b[0])}}}</code></td><td>${esc(b[1])}</td></tr>`).join('') + '</tbody></table></div>', buttons: [] });
    mm.querySelector('tbody').onclick = e => {
      const c = e.target.closest('[data-copy]'); if (!c) return;
      Promise.resolve().then(() => navigator.clipboard.writeText(c.dataset.copy)).then(() => toast('Đã sao chép ' + c.dataset.copy)).catch(() => toast('Trình duyệt không cho sao chép tự động, hãy bôi đen và Ctrl+C.', 'err'));
    };
  }
}

      ['chuHo', 'Chủ hộ / người đại diện (in trên sổ doanh thu)'], ['mst', 'Mã số thuế'],
      ['vatMacDinh', 'Thuế GTGT mặc định (%)', { type: 'number' }], ['baoHanhThang', 'Bảo hành mặc định (tháng)', { type: 'number' }],
      ['hinhThuc', 'Hình thức thu tiền (mỗi dòng một hình thức)', { area: true }],
      ['qrNganHang', 'Mã QR chuyển khoản – ngân hàng', { options: [['', '— Không dùng mã QR —'], ...S.nganHang] }], ['qrSoTK', 'Số tài khoản nhận tiền', { ph: 'Viết liền, không dấu cách' }],
      ['qrChuTK', 'Tên chủ tài khoản (không dấu)'], ['kyTen', 'Chức danh người ký báo giá'],
      ['nganHang', 'Dòng thông tin thanh toán in trên chứng từ', { full: true }],
      ['loiMo', 'Lời mở đầu báo giá', { area: true }], ['dieuKien', 'Điều kiện thương mại (mỗi dòng một ý)', { area: true }], ['gioiThieu', 'Giới thiệu cuối báo giá', { area: true }],
    ], Object.assign({}, c, { tenNgan: S.cuaHang.ten, moTa: S.cuaHang.moTa, diaChi: lines(c.diaChi), hinhThuc: lines(c.hinhThuc), dieuKien: lines(c.dieuKien) })),
    buttons: [{ t: 'Lưu (F8)', ic: 'save', cls: 'primary', save: true, fn: run(async m => {
      const r = await api('luuCuaHang', formData(m));
      S.congTy = r.congTy;
      [S.cuaHang, S.dsCuaHang.find(x => x.id === S.cuaHang.id)].forEach(x => { if (x) Object.assign(x, { ten: r.ten, moTa: r.moTa }); });
      applyShop(); closeModal(); render(); toast('Đã lưu thông tin cửa hàng.');
    }) }],
  });
}

// ===================== Phím tắt: F2 mới, F3 tìm, F8 lưu, Esc đóng =====================
const VIEWS = { home: vHome, baogia: vBaoGia, donhang: vDonHang, congno: vCongNo, hang: vHang, kho: vKho, ton: vTon, khach: vKhach, taikhoan: vTaiKhoan, caidat: vCaiDat, baohanh: vBaoHanh, hopdong: vHopDong, hd: vHD, baocao: vBaoCao, nhatky: vNhatKy, doc: vDoc };
document.addEventListener('keydown', e => {
  if ($('#app').classList.contains('hidden')) return;
  const modalOpen = !$('#modal').classList.contains('hidden');
  if (e.key === 'Escape' && modalOpen) closeModal();
  if (e.key === 'F8') {
    e.preventDefault();
    if (modalOpen) { const b = $('#modal [data-save]'); if (b && !b.disabled) b.click(); }
    else if (S.view === 'doc') run(saveDoc)();
    else if (S.view === 'hd') run(saveHD)();
  }
  if (e.key === 'F2' && !modalOpen && S.onNew) { e.preventDefault(); S.onNew(); }
  if (e.key === 'F3' && !modalOpen) { const s = $('#view .search input'); if (s) { e.preventDefault(); s.focus(); } }
});
