<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --brand: #0b4174; --brand-d: #08325a; --brand-50: #e9f0f8; --brand-rgb: 11,65,116; /* đổi theo cửa hàng khi đăng nhập */
  --grad: linear-gradient(120deg, #0b4174, #1f5f9e 55%, #ff6b4a);
  --ink: #1d2433; --ink2: #4b5565; --muted: #8a93a3; --line: #e8eaef; --bg: #f4f5f8;
  --green: #16a34a; --r: 14px; --sh: 0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.5 "Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
.hidden { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; }

/* ---- Đăng nhập ---- */
.login { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 1fr; background: #fff; }
.login-art { position: relative; overflow: hidden; color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: space-between;
  background: radial-gradient(circle at 15% 15%, rgba(255,255,255,.16) 0, transparent 45%), var(--grad); }
.login-art::after { content: ""; position: absolute; right: -130px; bottom: -130px; width: 380px; height: 380px; border-radius: 50%; background: rgba(255,255,255,.08); }
.login-art h2 { font-size: 34px; line-height: 1.25; margin: 0 0 12px; max-width: 440px; }
.login-art p { opacity: .9; max-width: 430px; margin: 0; }
.login-art ul { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 12px; }
.login-art li { display: flex; gap: 10px; align-items: center; }
.login-box { display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
.login form { width: 360px; max-width: 100%; }
.login h1 { font-size: 24px; margin: 18px 0 4px; }
.login .sub { color: var(--muted); margin: 0 0 22px; }
.login .field { margin-bottom: 14px; }
.login .btn { width: 100%; justify-content: center; padding: 11px; margin-top: 6px; }
.login .err { color: var(--brand); min-height: 22px; margin-top: 12px; }
@media (max-width: 860px) { .login { grid-template-columns: 1fr; } .login-art { display: none; } }
.mark { width: 42px; height: 42px; border-radius: 12px; background: var(--brand); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 14px rgba(var(--brand-rgb),.3); flex: none; overflow: hidden; }
.mark svg { width: 22px; height: 22px; }
.mark svg.logo { width: 100%; height: 100%; }
.login-art .mark { background: rgba(255,255,255,.18); box-shadow: none; }

/* ---- Khung: menu trái + nội dung ---- */
.side { position: fixed; inset: 0 auto 0 0; width: 252px; background: #fff; border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 30; transition: transform .2s; }
.logo { display: flex; gap: 12px; align-items: center; padding: 20px 20px 10px; }
.logo b { display: block; font-size: 15px; }
.logo small { color: var(--muted); font-size: 12px; }
.nav { flex: 1; overflow: auto; padding: 4px 12px 12px; }
.nav .sec { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #a0a7b4; margin: 16px 12px 6px; text-transform: uppercase; }
.nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; color: var(--ink2); cursor: pointer; font-weight: 500; margin: 2px 0; }
.nav a:hover { background: #f5f6f8; color: var(--ink); }
.nav a.on { background: var(--brand-50); color: var(--brand); font-weight: 600; }
.nav .cnt { margin-left: auto; background: var(--brand); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 0 7px; line-height: 18px; }
.me { border-top: 1px solid var(--line); padding: 12px 14px; display: flex; gap: 10px; align-items: center; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--brand-50); color: var(--brand); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.me .who { flex: 1; min-width: 0; line-height: 1.3; }
.me .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me .who small { color: var(--muted); }
.icon-btn { border: none; background: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; cursor: pointer; color: var(--ink2); flex: none; }
.icon-btn:hover { background: #f1f3f6; color: var(--ink); }
.main { margin-left: 252px; min-height: 100vh; }
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(244,245,248,.9); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 12px; padding: 18px 28px 14px; flex-wrap: wrap; }
.topbar .crumb { color: var(--muted); font-size: 12.5px; font-weight: 500; }
.topbar h1 { font-size: 21px; margin: 0; line-height: 1.3; }
.top-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.view { padding: 4px 28px 40px; }
.menu-btn { display: none; }
.scrim { display: none; }
@media (max-width: 960px) {
  .side { transform: translateX(-100%); } .side.open { transform: none; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .scrim.on { display: block; position: fixed; inset: 0; background: rgba(15,23,42,.35); z-index: 25; }
  .main { margin-left: 0; } .menu-btn { display: grid; }
  .topbar { padding: 12px 16px; } .view { padding: 4px 16px 32px; }
}

/* ---- Thẻ, nút, ô nhập ---- */
.card { background: #fff; border: 1px solid #edf0f3; border-radius: var(--r); box-shadow: var(--sh); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.card-h h3 { margin: 0; font-size: 15px; }
.card-h .more { margin-left: auto; color: var(--brand); font-weight: 600; font-size: 13px; cursor: pointer; }
.card-b { padding: 16px 18px; }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #dfe3ea; background: #fff; color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: #cdd3dd; background: #fafbfc; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 4px 10px rgba(var(--brand-rgb),.25); }
.btn.primary:hover { background: var(--brand-d); }
.btn.soft { background: var(--brand-50); border-color: var(--brand-50); color: var(--brand); }
.btn.danger { color: #b42318; }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .55; cursor: default; box-shadow: none; }
.btn svg.i { width: 16px; height: 16px; }
input, select, textarea { border: 1px solid #dfe3ea; border-radius: 10px; padding: 8px 11px; background: #fff; min-width: 0; outline: none; transition: border-color .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(var(--brand-rgb),.12); }
input[type=checkbox] { width: 16px; height: 16px; padding: 0; accent-color: var(--brand); }
input[readonly] { background: #f6f7f9; color: var(--ink2); }
textarea { resize: vertical; }
.field label, .field .lb { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink2); margin-bottom: 5px; }
.field input, .field select, .field textarea { width: 100%; }
.field .row { display: flex; gap: 6px; }
.field small { display: block; margin-top: 4px; }

/* ---- Danh sách ---- */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1 1 240px; max-width: 380px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 17px; height: 17px; }
.search input { width: 100%; padding-left: 36px; }
.toolbar select, .toolbar input[type=date] { padding: 7px 10px; }
.toolbar .count { margin-left: auto; color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; background: #eceef2; border-radius: 11px; padding: 3px; margin-bottom: 14px; }
.seg button { border: none; background: none; padding: 7px 14px; border-radius: 9px; font-weight: 600; color: var(--ink2); cursor: pointer; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.tbl-wrap { overflow: auto; max-height: calc(100vh - 260px); }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; }
.tbl th { position: sticky; top: 0; z-index: 1; background: #fafbfc; text-align: left; font-size: 11.5px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 14px; border-bottom: 1px solid #f1f3f6; vertical-align: top; }
.tbl.click tbody tr { cursor: pointer; }
.tbl.click tbody tr:hover td { background: rgba(var(--brand-rgb),.04); }
.num { text-align: right !important; white-space: nowrap; font-variant-numeric: tabular-nums; }
.code { font-weight: 600; color: var(--brand); white-space: nowrap; }
.tbl .wrap { min-width: 200px; }
.sub { display: block; color: var(--muted); font-size: 12.5px; }
.empty { text-align: center; color: var(--muted); padding: 36px 16px !important; }
.muted { color: var(--muted); } .red { color: #b42318; } .green { color: var(--green); } .warn { color: #b45309; }
.foot { padding: 12px 18px; color: var(--ink2); font-size: 13px; display: flex; gap: 18px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.b-green { background: #e7f6ec; color: #15803d; } .b-amber { background: #fff3df; color: #b45309; } .b-blue { background: #e8f0fe; color: #1d4ed8; }
.b-gray { background: #f0f2f5; color: #475467; } .b-red { background: #fdecea; color: #b42318; } .b-violet { background: #f1ebfe; color: #6d28d9; }

/* ---- Tổng quan ---- */
.hello { position: relative; overflow: hidden; border-radius: 18px; padding: 24px 26px; color: #fff; background: var(--grad); display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.hello h2 { margin: 0 0 4px; font-size: 22px; }
.hello p { margin: 0; opacity: .92; }
.hello .quick { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 1; }
.hello .quick .btn { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.35); color: #fff; }
.hello .quick .btn:hover { background: rgba(255,255,255,.28); }
.hello::before, .hello::after { content: ""; position: absolute; border-radius: 50%; background: rgba(255,255,255,.1); }
.hello::before { width: 220px; height: 220px; right: -60px; top: -110px; }
.hello::after { width: 140px; height: 140px; right: 200px; bottom: -95px; }
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 18px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .kpis { grid-template-columns: 1fr; } }
.kpi { padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; cursor: pointer; transition: transform .15s; }
.kpi:hover { transform: translateY(-2px); }
.kpi .ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; flex: none; }
.kpi .ic svg { width: 22px; height: 22px; }
.kpi .l { color: var(--muted); font-size: 13px; font-weight: 500; }
.kpi .v { font-size: 23px; font-weight: 700; margin: 2px 0; letter-spacing: -.3px; }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 16px; }
.donut { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.d-num { font-size: 16px; font-weight: 700; fill: var(--ink); }
.d-lbl { font-size: 8.5px; fill: var(--muted); }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; flex: 1; min-width: 170px; }
.legend li { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.legend span { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend b { margin-left: auto; font-weight: 600; }
.bars { display: flex; align-items: flex-end; gap: 10px; height: 210px; }
.bars .col { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; height: 100%; }
.bars .pair { flex: 1; display: flex; gap: 3px; align-items: flex-end; width: 100%; justify-content: center; }
.bars i { display: block; width: 40%; max-width: 16px; border-radius: 5px 5px 2px 2px; min-height: 2px; }
.bars span { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.bars .now span { color: var(--ink); font-weight: 700; }
.chart-legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink2); margin-left: auto; flex-wrap: wrap; }
.chart-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; background: var(--c); }
.mini { width: 100%; border-collapse: collapse; }
.mini td { padding: 9px 0; border-bottom: 1px dashed #eceef2; vertical-align: top; }
.mini td + td { padding-left: 10px; }
.mini tr:last-child td { border-bottom: none; }
.mini tr[data-go] { cursor: pointer; }
.mini tr[data-go]:hover td:first-child { color: var(--brand); }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .bars { gap: 4px; } }

/* ---- Cài đặt ---- */
.adv summary { cursor: pointer; padding: 14px 18px; font-weight: 700; list-style: none; display: flex; align-items: center; gap: 8px; }
.adv summary::-webkit-details-marker { display: none; }
.adv summary::after { content: "›"; margin-left: auto; font-size: 20px; line-height: 1; color: var(--muted); transition: transform .15s; }
.adv[open] summary::after { transform: rotate(90deg); }
.adv[open] summary { border-bottom: 1px solid var(--line); }
.shops { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.shop-opt { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; justify-items: start; }
.shop-opt:hover, .shop-opt.on { border-color: var(--brand); }
.shop-opt.on { background: var(--brand-50); cursor: default; }
.checks { display: grid; gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; }
.me-big { display: flex; gap: 12px; align-items: center; }

/* ---- Hộp thoại ---- */
.modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; padding: 48px 14px; z-index: 50; overflow: auto; }
.box { background: #fff; border-radius: 18px; width: 640px; max-width: 100%; box-shadow: 0 24px 60px rgba(15,23,42,.25); animation: pop .16s ease-out; }
@keyframes pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.box.wide { width: 920px; }
.box-h { display: flex; align-items: center; gap: 10px; padding: 18px 22px 4px; }
.box-h h3 { margin: 0; font-size: 18px; }
.box-h .icon-btn { margin-left: auto; }
.box-b { padding: 12px 22px 6px; }
.box-f { display: flex; gap: 8px; justify-content: flex-end; padding: 16px 22px 20px; flex-wrap: wrap; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; }
.fgrid .full { grid-column: 1 / -1; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 16px 0 4px; }
.stat { background: #f7f8fa; border-radius: 12px; padding: 10px 14px; }
.stat .l { font-size: 12px; color: var(--muted); }
.stat .v { font-weight: 700; font-size: 17px; }
.box .tbl-wrap { max-height: 280px; border: 1px solid var(--line); border-radius: 12px; }
@media (max-width: 600px) { .fgrid { grid-template-columns: 1fr; } .modal { padding: 16px 8px; } }

/* ---- Soạn chứng từ ---- */
.doc-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; padding: 18px; }
.doc-head .full { grid-column: 1 / -1; }
.lines-wrap { overflow: auto; border-top: 1px solid var(--line); }
table.lines { width: 100%; border-collapse: collapse; min-width: 1040px; }
.lines th { background: #fafbfc; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lines td { padding: 3px 4px; border-bottom: 1px solid #f1f3f6; }
.lines input, .lines select { width: 100%; border-color: transparent; background: transparent; padding: 7px 8px; border-radius: 8px; }
.lines input:hover, .lines select:hover { border-color: #e3e7ee; }
.lines input:focus, .lines select:focus { border-color: var(--brand); background: #fff; }
.lines td.c { padding: 9px 10px; }
.lines select.tuy { color: #b45309; font-weight: 600; }
.doc-foot { display: flex; gap: 12px 16px; padding: 16px 18px; flex-wrap: wrap; align-items: flex-start; }
.doc-foot .hint { color: var(--muted); font-size: 12.5px; max-width: 420px; }
.totals { margin-left: auto; min-width: 300px; background: #fafbfc; border-radius: 12px; padding: 12px 16px; }
.totals div { display: flex; justify-content: space-between; gap: 24px; padding: 4px 0; }
.totals .sum { border-top: 1px dashed #dfe3ea; margin-top: 6px; padding-top: 10px; font-size: 17px; font-weight: 700; }
.side-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }

/* ---- Gợi ý, thông báo ---- */
.picker { position: fixed; z-index: 60; background: #fff; border: 1px solid #e3e7ee; border-radius: 12px; box-shadow: 0 12px 32px rgba(15,23,42,.18); max-height: 330px; overflow: auto; padding: 4px; }
.picker div { padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.picker div.on { background: var(--brand-50); }
.picker small { color: var(--muted); display: block; }
#toast { position: fixed; right: 18px; bottom: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 70; }
#toast div { background: #1d2433; color: #fff; padding: 10px 16px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,.2); max-width: 380px; }
#toast .err { background: #b42318; }
#busy { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: linear-gradient(90deg, var(--brand), #f59e0b); z-index: 99; }
#busy.on { width: 85%; transition: width 6s cubic-bezier(.1,.7,.3,1); }

/* ---- Mã QR chuyển khoản, báo cáo ---- */
.qr { margin-top: 14px; }
.qr-box { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; margin-top: 10px; color: var(--ink2); }
.qr-box img { width: 210px; max-width: 100%; border: 1px solid var(--line); border-radius: 12px; }
.qr-box div { flex: 1; min-width: 180px; }
.rpt-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 18px; }
.rpt-bar input[type=date] { padding: 7px 10px; }

/* ---- Bản in ---- */
#print { display: none; }
@media print {
  body { background: #fff; }
  #login, #app, #modal, #toast, #busy, #picker { display: none !important; }
  #print { display: block; }
  @page { size: A4; margin: 12mm 12mm 14mm; }
}
.p-page { font: 12.5px/1.4 "Times New Roman", Times, serif; color: #000; }
.p-head { text-align: center; border-bottom: 2px solid #000; padding-bottom: 6px; }
.p-co { font-size: 16px; font-weight: 700; }
.p-page h1 { text-align: center; font-size: 20px; margin: 14px 0 10px; }
.p-info { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
.p-info td { padding: 2px 4px; vertical-align: top; }
.p-info td:nth-child(odd) { white-space: nowrap; font-weight: 700; width: 1%; }
.p-info td:nth-child(4) { white-space: nowrap; }
.p-lines { width: 100%; border-collapse: collapse; margin: 8px 0; }
.p-lines th, .p-lines td { border: 1px solid #000; padding: 4px 5px; vertical-align: top; }
.p-lines th { background: #eee; text-align: center; }
.p-lines tfoot td { font-weight: 700; }
.p-page ul { margin: 4px 0; padding-left: 20px; }
.p-sign { display: flex; justify-content: space-around; margin-top: 18px; text-align: center; font-weight: 700; }
.p-sign div { flex: 1; padding-bottom: 70px; }
.p-sign i { display: block; font-weight: 400; }
.p-pay { display: flex; gap: 14px; justify-content: space-between; align-items: flex-start; }
.p-qr { flex: none; text-align: center; font-size: 11px; }
.p-qr img { display: block; width: 34mm; height: 34mm; margin: 0 auto 2px; }
.p-form { display: flex; justify-content: space-between; gap: 20px; }
.p-form .r { text-align: center; font-size: 11.5px; max-width: 72mm; }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <div class="login-art">
    <div class="mark" id="artMark"></div>
    <div>
      <h2>Quản lý bán hàng, kho và công nợ</h2>

// Đọc số tiền bằng chữ (in trên chứng từ)
function docSo(n) {
  n = Math.round(Math.abs(+n || 0));
  if (!n) return 'Không đồng';
  const so = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
  const ba = (x, du) => { // x < 1000; du = đọc cả "không trăm", "linh" khi không phải nhóm đầu
    const t = Math.floor(x / 100), c = Math.floor(x % 100 / 10), d = x % 10, out = [];
    if (du || t) out.push(so[t] + ' trăm');
    if (c > 1) out.push(so[c] + ' mươi'); else if (c === 1) out.push('mười'); else if (d && (du || t)) out.push('linh');
    if (d) out.push(d === 1 && c > 1 ? 'mốt' : d === 5 && c > 0 ? 'lăm' : d === 4 && c > 1 ? 'tư' : so[d]);
    return out.join(' ');
  };
  const donVi = ['', ' nghìn', ' triệu', ' tỷ', ' nghìn tỷ', ' triệu tỷ'];
  const nhom = [];
  for (; n > 0; n = Math.floor(n / 1000)) nhom.push(n % 1000);
  const s = nhom.map((x, i) => x ? ba(x, i < nhom.length - 1) + donVi[i] : '').reverse().filter(Boolean).join(' ');
  return s.charAt(0).toUpperCase() + s.slice(1) + ' đồng';
}

// Ảnh mã VietQR: khách quét bằng app ngân hàng là có sẵn số tài khoản, số tiền, nội dung. Chưa khai tài khoản thì trả về ''.
// ponytail: ảnh do dịch vụ Quick Link của vietqr.io tạo (số TK + số tiền đi qua máy chủ đó); muốn không phụ thuộc thì tự sinh chuỗi EMVCo + thư viện QR.
function qrUrl(soTien, noiDung, kieu) {
  const c = S.congTy, p = [];
  if (!c.qrNganHang || !c.qrSoTK) return '';
  if (soTien > 0) p.push('amount=' + Math.round(soTien));
  if (noiDung) p.push('addInfo=' + encodeURIComponent(norm(noiDung).replace(/[^0-9a-z]+/g, ' ').trim().toUpperCase().slice(0, 50)));
  if (c.qrChuTK) p.push('accountName=' + encodeURIComponent(c.qrChuTK));
  // Viết tách 'https:/' + '/…': Apps Script tự xóa chú thích trong trang và sẽ cắt mọi thứ sau hai dấu gạch chéo liền nhau (xem dev/kiem-tra-html.js)
  return 'https:/' + '/img.vietqr.io/image/' + encodeURIComponent(c.qrNganHang) + '-' + encodeURIComponent(c.qrSoTK) + '-' + (kieu || 'compact2') + '.png?' + p.join('&');
}

function toast(msg, type) {
  const d = document.createElement('div');
  d.textContent = msg; if (type) d.className = type;
  $('#toast').append(d);
  setTimeout(() => d.remove(), type === 'err' ? 6000 : 3000);
}

let pending = 0;
function call(fn, ...args) {
  pending++; $('#busy').classList.add('on');
  const done = () => { if (--pending === 0) $('#busy').classList.remove('on'); };
  return new Promise((ok, fail) => google.script.run
    .withSuccessHandler(r => { done(); ok(r); })
    .withFailureHandler(e => {
      done();
      if (errMsg(e).includes('HET_PHIEN')) {
        const m = 'Phiên đăng nhập đã hết, vui lòng đăng nhập lại.';
        showLogin(m); fail(new Error(m)); return;
      }
      fail(e);
    })[fn](...args));
}
const api = (fn, ...args) => call(fn, S.token, ...args);
// Chạy thao tác, lỗi hiện thành thông báo đỏ
const run = fn => (...a) => Promise.resolve().then(() => fn(...a)).catch(e => toast(errMsg(e), 'err'));

// ===================== Số liệu suy ra =====================
function derive() {
  const add = (m, k, v) => { m[k] = (m[k] || 0) + v; };
  D.thuDH = {}; D.thuKH = {}; D.muaKH = {}; D.dhBG = {}; D.noKH = {};
  S.thuTien.forEach(p => { if (p.SoDH) add(D.thuDH, p.SoDH, +p.SoTien || 0); add(D.thuKH, p.MaKH, +p.SoTien || 0); });
  S.donHang.forEach(d => { if (d.SoBG) D.dhBG[d.SoBG] = d.SoDH; if (d.TrangThai !== 'Hủy') add(D.muaKH, d.MaKH, +d.TongCong || 0); });
  new Set([...Object.keys(D.muaKH), ...Object.keys(D.thuKH)]).forEach(k => { D.noKH[k] = (D.muaKH[k] || 0) - (D.thuKH[k] || 0); });
}
const daThu = d => D.thuDH[d.SoDH] || 0;
const conNo = d => d.TrangThai === 'Hủy' ? 0 : Math.max(0, (+d.TongCong || 0) - daThu(d));
const tonOf = ma => { const t = S.ton[ma]; return t ? t.nhap - t.xuat : 0; };
const isLow = h => S.ton[h.MaHH] ? tonOf(h.MaHH) <= (+h.TonToiThieu || 0) : h.TonToiThieu !== '' && +h.TonToiThieu > 0;
const TT_DH = { 'Chờ giao': 'b-amber', 'Giao một phần': 'b-blue', 'Đã giao': 'b-green', 'Hủy': 'b-gray' };
const ttGiao = d => badge(d.TrangThai || 'Chờ giao', TT_DH[d.TrangThai] || 'b-amber');
function ttThu(d) {
  if (d.TrangThai === 'Hủy') return '';
  const t = daThu(d), tc = +d.TongCong || 0;
  return t <= 0 ? badge('Chưa thu', 'b-red') : t >= tc ? badge('Đã thu đủ', 'b-green') : badge('Thu một phần', 'b-amber');
}
function tonBadge(h) {
  if (!S.ton[h.MaHH] && !(+h.TonToiThieu > 0)) return '<span class="muted">—</span>';
  const t = tonOf(h.MaHH);
  return t <= 0 ? badge('Hết hàng', 'b-red') : isLow(h) ? badge('Sắp hết', 'b-amber') : badge('Còn hàng', 'b-green');
}
const byDate = (a, b) => String(b.Ngay + b.NgayTao).localeCompare(String(a.Ngay + a.NgayTao));
function sortAll() { S.khach.sort((a, b) => String(b.MaKH).localeCompare(String(a.MaKH))); [S.baoGia, S.donHang, S.phieuKho, S.thuTien, S.hopDong].forEach(l => l.sort(byDate)); }
function upsertLocal(list, key, obj) {
  const i = S[list].findIndex(x => x[key] === obj[key]);
  if (i >= 0) S[list][i] = obj; else S[list].unshift(obj);
}

function showLogin(msg) {
  S.token = null; store.set('hqp_token', null);
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#view').innerHTML = ''; // không để dữ liệu cũ trong trang khi đã thoát
  document.documentElement.removeAttribute('style');
  closeModal(); hidePicker();
  $('#lgErr').textContent = msg || '';
  $('#lgUser').focus();
  // tên cửa hàng trên trang đăng nhập theo thông tin quản trị đã sửa trong Cài đặt
  call('thongTinDangNhap').then(c => { $('#lgSub').textContent = c.ten + ' – ' + c.moTa; $('#artCopy').textContent = '© ' + c.ten; }).catch(() => {});
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true; $('#lgErr').textContent = '';
  try {
    const r = await call('dangNhap', $('#lgUser').value, $('#lgPass').value);
    S.token = r.token; store.set('hqp_token', r.token);
    $('#lgPass').value = '';
    await loadAll();
    showApp();
  } catch (err) { $('#lgErr').textContent = errMsg(err); }
  btn.disabled = false;
});

async function loadAll() {
  Object.assign(S, await api('taiDuLieu'));
  if (S.q.baocao) S.q.baocao.hang = null;
  sortAll(); derive();
}

function modal({ title, body, buttons = [], wide }) {
  const m = $('#modal');
  m.innerHTML = `<div class="box${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="box-h"><h3>${esc(title)}</h3><button class="icon-btn" data-close title="Đóng (Esc)">${icon('x')}</button></div>
    <div class="box-b">${body}</div>
    <div class="box-f">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-b="${i}"${b.save ? ' data-save' : ''}>${b.ic ? icon(b.ic) : ''}${esc(b.t)}</button>`).join('')}<button class="btn" data-close>Đóng</button></div>
  </div>`;
  m.classList.remove('hidden');
  m.onclick = e => {
    if (e.target.closest('[data-close]')) return closeModal();
    const b = e.target.closest('[data-b]');
    if (b && !b.disabled) { b.disabled = true; Promise.resolve(buttons[+b.dataset.b].fn(m)).finally(() => { b.disabled = false; }); }
  };
  const f = m.querySelector('.box-b input:not([readonly]):not([disabled]):not([type=hidden]), .box-b select, .box-b textarea');
  if (f) f.focus();
  return m;
}
function closeModal() { const m = $('#modal'); m.classList.add('hidden'); m.innerHTML = ''; hidePicker(); }

// fields: [tên, nhãn, {ro, ph, area, options, type, money, list, full}]
function formHtml(fields, o) {
  return '<div class="fgrid">' + fields.map(([k, label, opt = {}]) => {
    const v = o[k] ?? '';
    const a = `name="${k}"${opt.ro ? ' readonly' : ''}${opt.ph ? ` placeholder="${esc(opt.ph)}"` : ''}${opt.list ? ` list="${opt.list}"` : ''}`;
    const input = opt.area ? `<textarea ${a} rows="3">${esc(v)}</textarea>`
      : opt.options ? `<select ${a}${opt.ro ? ' disabled' : ''}>${opt.options.map(x => { const [val, txt] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(txt)}</option>`; }).join('')}</select>`
      : `<input ${a} type="${opt.type || 'text'}"${opt.money ? ' class="money num" inputmode="numeric"' : ''} value="${esc(opt.money ? money(v) : v)}">`;
    return `<label class="field${opt.full || opt.area ? ' full' : ''}"><span class="lb">${esc(label)}</span>${input}</label>`;
  }).join('') + '</div>';
}
function formData(root) {
  const o = {};
  root.querySelectorAll('.box-b [name]').forEach(i => { o[i.name] = i.type === 'checkbox' ? i.checked : i.classList.contains('money') ? parseMoney(i.value) : i.value.trim(); });
  return o;
}

document.addEventListener('focusout', e => { if (e.target.classList && e.target.classList.contains('money')) e.target.value = money(parseMoney(e.target.value)); });

// cfg: {id, ph, cols:[{t,k,f,cls}], data(), text(r), filters:[{id, options|type:'dates', def}], filter(r,f), open(r), foot(rows)}
function listCard(el, cfg) {
  const st = S.q[cfg.id] || (S.q[cfg.id] = { text: '', f: {} });
  (cfg.filters || []).forEach(f => { if (f.def !== undefined && st.f[f.id] === undefined) st.f[f.id] = f.def; });
  const fHtml = (cfg.filters || []).map(f => f.type === 'dates'
    ? `<input type="date" data-f="${f.id}From" value="${esc(st.f[f.id + 'From'] || '')}" title="Từ ngày" aria-label="Từ ngày"><span class="muted">→</span><input type="date" data-f="${f.id}To" value="${esc(st.f[f.id + 'To'] || '')}" title="Đến ngày" aria-label="Đến ngày">`
    : `<select data-f="${f.id}" aria-label="Lọc">${f.options.map(([v, t]) => `<option value="${esc(v)}"${String(st.f[f.id] ?? '') === String(v) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`).join('');
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="toolbar"><label class="search">${icon('search')}<input type="search" placeholder="${esc(cfg.ph)} (F3)" value="${esc(st.text)}"></label>${fHtml}<span class="count"></span></div>
    <div class="tbl-wrap"><table class="tbl click"><thead><tr>${cfg.cols.map(c => `<th class="${c.cls || ''}">${c.t}</th>`).join('')}</tr></thead><tbody></tbody></table></div>
    ${cfg.foot ? '<div class="foot"></div>' : ''}`;
  el.append(card);
  const q = $('.search input', card), body = $('tbody', card), count = $('.count', card);
  let rows = [];
  const refresh = () => {
    const w = words(st.text);
    rows = cfg.data().filter(r => (!cfg.filter || cfg.filter(r, st.f)) && matches(w, r, cfg.text));
    const shown = rows.slice(0, LIMIT);
    body.innerHTML = shown.length ? shown.map((r, i) => `<tr data-i="${i}">${cfg.cols.map(c => `<td class="${c.cls || ''}">${c.f ? c.f(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('')
      : `<tr><td class="empty" colspan="${cfg.cols.length}">Không có dữ liệu phù hợp</td></tr>`;
    count.textContent = rows.length > LIMIT ? `Hiện ${LIMIT} / ${rows.length} dòng` : `${rows.length} dòng`;
    if (cfg.foot) $('.foot', card).innerHTML = cfg.foot(rows);
  };
  let t;
  q.oninput = () => { st.text = q.value; clearTimeout(t); t = setTimeout(refresh, 120); };
  card.querySelectorAll('[data-f]').forEach(inp => { inp.onchange = () => { st.f[inp.dataset.f] = inp.value; refresh(); }; });
  body.onclick = e => { const tr = e.target.closest('tr[data-i]'); if (tr) cfg.open(rows[+tr.dataset.i]); };
  refresh();
  return refresh;
}

function kpi(go, ic, bg, fg, label, value, sub) {
  return `<div class="card kpi" data-go="${go}"><div class="ic" style="background:${bg};color:${fg}">${icon(ic)}</div>
    <div><div class="l">${label}</div><div class="v">${value}</div><div class="s">${sub}</div></div></div>`;
}
function donut(items, center, label, fmt) {
  const total = items.reduce((s, i) => s + i.value, 0), r = 46, C = 2 * Math.PI * r;
  let off = 0;
  const segs = items.filter(i => i.value > 0).map(i => {
    const len = i.value / total * C;
    const s = `<circle r="${r}" cx="60" cy="60" fill="none" stroke="${i.color}" stroke-width="16" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"><title>${esc(i.label)}: ${esc(fmt(i.value))}</title></circle>`;
    off += len; return s;
  }).join('');
  return `<div class="donut"><svg viewBox="0 0 120 120" width="150" height="150" role="img" aria-label="${esc(label)}"><circle r="${r}" cx="60" cy="60" fill="none" stroke="#f0f2f5" stroke-width="16"/>${segs}
    <text x="60" y="61" text-anchor="middle" class="d-num">${esc(center)}</text><text x="60" y="76" text-anchor="middle" class="d-lbl">${esc(label)}</text></svg>
    <ul class="legend">${items.map(i => `<li><span style="background:${i.color}"></span>${esc(i.label)}<b>${esc(fmt(i.value))}</b></li>`).join('')}</ul></div>`;
}

    <div class="card"><div class="card-h"><h3>Hàng sắp hết</h3><a class="more" data-go="ton">Tồn kho</a></div><div class="card-b">
      ${miniTable(low.slice(0, 6).map(h => `<tr data-go="hh:${esc(h.MaHH)}"><td><b>${esc(h.TenHang)}</b><span class="sub">${esc([h.MaHH, h.Model].filter(Boolean).join(' · '))}</span></td><td class="num">Tồn <b class="red">${money(tonOf(h.MaHH))}</b><span class="sub">tối thiểu ${money(+h.TonToiThieu || 0)}</span></td></tr>`), 'Chưa có mặt hàng nào dưới mức tồn tối thiểu.')}</div></div>
    <div class="card"><div class="card-h"><h3>Bán chạy 90 ngày</h3><a class="more" data-go="hang">Hàng hóa</a></div><div class="card-b">
      ${miniTable(S.thongKe.topHang.slice(0, 6).map(h => `<tr${h.MaHH ? ` data-go="hh:${esc(h.MaHH)}"` : ''}><td><b>${esc(h.TenHang)}</b><span class="sub">${money(h.SoLuong)} ${esc(h.DVT)}</span></td><td class="num">${money(h.ThanhTien)} ₫</td></tr>`), 'Chưa có đơn hàng trong 90 ngày.')}</div></div>
  </div>`;
  el.onclick = run(async e => {
    const q = e.target.closest('[data-q]'), g = e.target.closest('[data-go]');
    if (q) return ({ BG: () => newDoc('BG'), DH: () => newDoc('DH'), PT: () => openThu(), NK: () => newDoc('NK') })[q.dataset.q]();
    if (!g) return;
    const [kind, id] = g.dataset.go.split(':');
    if (kind === 'dh') await openDoc('DH', S.donHang.find(d => d.SoDH === id));
    else if (kind === 'kh') openKhach(S.khach.find(k => k.MaKH === id));
    else if (kind === 'hh') { const h = S.hang.find(x => x.MaHH === id); if (h) openHang(h); }
    else go(kind);
  });
}

function openThu(pt) {
  const isNew = !pt || !pt.SoPT;
  const hinhThuc = S.congTy.hinhThuc || ['Chuyển khoản', 'Tiền mặt'];
  pt = Object.assign({ Ngay: today(), HinhThuc: hinhThuc[0], MaKH: '', TenKH: '', SoDH: '', SoTien: '', GhiChu: '' }, pt || {});
  if (isNew && pt.SoDH) { const d = S.donHang.find(x => x.SoDH === pt.SoDH); if (d) Object.assign(pt, { MaKH: d.MaKH, TenKH: d.TenKH, SoTien: conNo(d) }); }
  if (isNew && pt.MaKH && !pt.TenKH) { const k = S.khach.find(x => x.MaKH === pt.MaKH); if (k) pt.TenKH = k.TenKH; }
  const ordersOf = ma => S.donHang.filter(x => x.MaKH === ma && x.TrangThai !== 'Hủy' && (conNo(x) > 0 || x.SoDH === pt.SoDH));
  const orderOpts = ma => `<option value="">— Không gắn đơn (trả trước / nợ cũ) —</option>` + ordersOf(ma).map(x =>
    `<option value="${esc(x.SoDH)}"${x.SoDH === pt.SoDH ? ' selected' : ''}>${esc(x.SoDH)} · ${dmy(x.Ngay)} · còn nợ ${money(conNo(x))} ₫</option>`).join('');
  const m = modal({
    title: isNew ? 'Thu tiền khách hàng' : 'Phiếu thu ' + pt.SoPT,
    body: `<div class="fgrid">
      <label class="field full"><span class="lb">Khách hàng *</span><input name="TenKH" value="${esc(pt.TenKH)}" placeholder="Gõ tên hoặc SĐT để tìm" autocomplete="off"${isNew ? '' : ' readonly'}><input type="hidden" name="MaKH" value="${esc(pt.MaKH)}"></label>
      <label class="field full"><span class="lb">Thu cho đơn hàng</span><select name="SoDH">${orderOpts(pt.MaKH)}</select></label>
      <label class="field"><span class="lb">Số tiền *</span><input name="SoTien" class="money num" inputmode="numeric" value="${money(pt.SoTien)}"></label>
      <label class="field"><span class="lb">Ngày thu</span><input name="Ngay" type="date" value="${esc(pt.Ngay)}"></label>
      <label class="field"><span class="lb">Hình thức</span><select name="HinhThuc">${hinhThuc.map(x => `<option${x === pt.HinhThuc ? ' selected' : ''}>${x}</option>`).join('')}</select></label>
      <label class="field"><span class="lb">Ghi chú</span><input name="GhiChu" value="${esc(pt.GhiChu)}" placeholder="vd: Đặt cọc 50%"></label>
    </div>${isNew ? '' : `<p class="muted">Lập bởi ${esc(pt.NguoiTao)} lúc ${esc(pt.NgayTao)}</p>`}${S.congTy.qrSoTK ? `<div class="qr"><button type="button" class="btn sm" data-qr>${icon('card')}Mã QR chuyển khoản</button><div class="qr-box" data-qrbox></div></div>` : ''}`,
    buttons: [
      { t: 'Lưu (F8)', ic: 'save', cls: 'primary', save: true, fn: run(async m => {
        const d = formData(m);
        if (!d.MaKH) throw new Error('Chọn khách hàng trong danh sách.');
        if (!(d.SoTien > 0)) throw new Error('Nhập số tiền thu.');
        const saved = await api('luuThuTien', Object.assign({}, d, { SoPT: pt.SoPT || '' }));
        upsertLocal('thuTien', 'SoPT', saved); sortAll(); derive();
        closeModal(); render(); toast(`Đã lưu phiếu thu ${saved.SoPT}: ${money(saved.SoTien)} ₫.`);
      }) },
      ...(isNew ? [] : [{ t: 'In phiếu thu', ic: 'print', fn: () => printHtml(ptPrintHtml(pt)) }]),
      ...(!isNew && isAdmin() ? [{ t: 'Xóa', ic: 'trash', cls: 'danger', fn: run(async () => {
        if (!confirm(`Xóa phiếu thu ${pt.SoPT} (${money(pt.SoTien)} ₫)?`)) return;
        await api('xoaThuTien', pt.SoPT);
        S.thuTien = S.thuTien.filter(x => x.SoPT !== pt.SoPT); derive();
        closeModal(); render(); toast('Đã xóa phiếu thu.');
      }) }] : []),
    ],
  });
  const tk = $('[name=TenKH]', m), mk = $('[name=MaKH]', m), sel = $('[name=SoDH]', m), tien = $('[name=SoTien]', m);
  const fillFromOrder = () => { const x = S.donHang.find(d => d.SoDH === sel.value); if (x && isNew) tien.value = money(conNo(x)); };
  if (isNew) tk.oninput = () => {
    mk.value = ''; sel.innerHTML = orderOpts('');
    showPicker(tk, khachSource, kh => {
      tk.value = kh.TenKH; mk.value = kh.MaKH; sel.innerHTML = orderOpts(kh.MaKH);
      if (ordersOf(kh.MaKH).length === 1) { sel.selectedIndex = 1; fillFromOrder(); }
      tien.focus();
    });
  };
  sel.onchange = fillFromOrder;
  const qb = $('[data-qr]', m);
  if (qb) qb.onclick = () => {
    const so = parseMoney(tien.value) || 0, ck = [...$('[name=HinhThuc]', m).options].find(o => /chuyển khoản/i.test(o.value));
    if (ck) ck.selected = true; // khách quét mã tức là trả bằng chuyển khoản
    $('[data-qrbox]', m).innerHTML = so > 0 ? `<img alt="Mã QR chuyển khoản" src="${esc(qrUrl(so, 'TT ' + (sel.value || mk.value)))}">
      <div>Khách quét bằng app ngân hàng: có sẵn số tiền <b>${money(so)} ₫</b> và nội dung chuyển khoản. Thấy tiền về thì bấm Lưu.</div>` : '<div>Nhập số tiền trước.</div>';
  };
}

// onPicked: dùng khi thêm khách từ màn hình soạn chứng từ
function openKhach(kh, onPicked) {
  const isNew = !kh; kh = kh || {};
  const bgs = isNew ? [] : S.baoGia.filter(b => b.MaKH === kh.MaKH);
  const dhs = isNew ? [] : S.donHang.filter(d => d.MaKH === kh.MaKH);
  const pts = isNew ? [] : S.thuTien.filter(p => p.MaKH === kh.MaKH);
  const hist = (title, rows, head, empty) => `<h4 style="margin:18px 0 8px">${title}</h4>` + (rows.length
    ? `<div class="tbl-wrap"><table class="tbl click"><thead><tr>${head.map(h => `<th class="${h[1] || ''}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`
    : `<p class="muted">${empty}</p>`);
  const extra = isNew ? '' : `<div class="stats">
      <div class="stat"><div class="l">Tổng mua</div><div class="v">${money(D.muaKH[kh.MaKH] || 0)} ₫</div></div>
      <div class="stat"><div class="l">Đã trả</div><div class="v green">${money(D.thuKH[kh.MaKH] || 0)} ₫</div></div>
      <div class="stat"><div class="l">Còn nợ</div><div class="v red">${money(Math.max(0, D.noKH[kh.MaKH] || 0))} ₫</div></div>
      <div class="stat"><div class="l">Báo giá / đơn</div><div class="v">${bgs.length} / ${dhs.length}</div></div></div>`
    + hist('Đơn hàng', dhs.map(d => `<tr data-open="DH:${esc(d.SoDH)}"><td class="code">${esc(d.SoDH)}</td><td>${dmy(d.Ngay)}</td><td class="num">${money(d.TongCong)}</td><td class="num">${conNo(d) ? `<span class="red">${money(conNo(d))}</span>` : '0'}</td><td>${ttGiao(d)}</td></tr>`),
      [['Số đơn'], ['Ngày'], ['Tổng cộng', 'num'], ['Còn nợ', 'num'], ['Giao hàng']], 'Chưa có đơn hàng.')
    + hist('Báo giá', bgs.map(b => `<tr data-open="BG:${esc(b.SoBG)}"><td class="code">${esc(b.SoBG)}</td><td>${dmy(b.Ngay)}</td><td class="num">${money(b.TongCong)}</td><td>${D.dhBG[b.SoBG] ? badge('Đã chốt', 'b-green') : badge('Chưa chốt', 'b-gray')}</td></tr>`),
      [['Số BG'], ['Ngày'], ['Tổng cộng', 'num'], ['Trạng thái']], 'Chưa có báo giá.')
    + hist('Phiếu thu', pts.map(p => `<tr data-open="PT:${esc(p.SoPT)}"><td class="code">${esc(p.SoPT)}</td><td>${dmy(p.Ngay)}</td><td>${esc(p.SoDH)}</td><td class="num green">${money(p.SoTien)}</td></tr>`),
      [['Số phiếu'], ['Ngày'], ['Đơn hàng'], ['Số tiền', 'num']], 'Chưa có phiếu thu.')
    + `<p class="muted">Tạo ngày ${dmy(kh.NgayTao)} bởi ${esc(kh.NguoiTao)}</p>`;
  const prefill = () => ({ MaKH: kh.MaKH, TenKH: kh.TenKH, NguoiNhan: kh.NguoiLienHe || '', SDT: kh.SDT || '', DiaChi: kh.DiaChi || '' });
  const m = modal({
    title: isNew ? 'Thêm khách hàng' : `${kh.TenKH}`, wide: !isNew,
    body: formHtml([
      ['MaKH', 'Mã khách hàng', { ro: true, ph: 'Tự sinh khi lưu' }], ['TenKH', 'Tên khách hàng / công ty *'], ['NguoiLienHe', 'Người liên hệ'],
      ['SDT', 'Điện thoại', { ph: 'Nhiều số cách nhau bằng dấu /' }], ['DiaChi', 'Địa chỉ', { full: true }], ['MST', 'Mã số thuế'], ['Email', 'Email'],
      ['NguoiDaiDien', 'Người đại diện (ký hợp đồng)'], ['ChucVu', 'Chức vụ'], ['VanPhongGD', 'Văn phòng giao dịch', { full: true }], ['SoTK', 'Số tài khoản'], ['NganHang', 'Ngân hàng', { list: 'dl-nh' }],
      ['GhiChu', 'Ghi chú', { area: true }],
    ], kh) + datalist('dl-nh', S.nganHang.map(b => b[1])) + extra,
    buttons: [
      { t: 'Lưu (F8)', ic: 'save', cls: 'primary', save: true, fn: run(async m => {
        const d = formData(m);
        if (!d.TenKH) throw new Error('Nhập tên khách hàng.');
        const phones = d.SDT.split(/[\/,;]/).map(digits).filter(p => p.length >= 8);
        const dup = S.khach.find(k => k.MaKH !== d.MaKH && phones.some(p => digits(k.SDT).includes(p)));
        if (dup && !confirm(`Số điện thoại này đã có ở khách ${dup.MaKH} – ${dup.TenKH}. Vẫn lưu?`)) return;
        const saved = await api('luuKhach', d);
        upsertLocal('khach', 'MaKH', saved);
        closeModal(); toast(`Đã lưu khách hàng ${saved.MaKH}.`);
        if (onPicked) onPicked(saved); else render();
      }) },
      ...(!isNew && !onPicked ? [
        { t: 'Lập báo giá', ic: 'file', fn: () => { closeModal(); newDoc('BG', prefill()); } },
        { t: 'Tạo đơn hàng', ic: 'cart', fn: () => { closeModal(); newDoc('DH', prefill()); } },
        { t: 'Lập hợp đồng', ic: 'clipboard', fn: () => { closeModal(); newHD(benAKhach(kh)); } },
        { t: 'Thu tiền', ic: 'card', fn: () => { closeModal(); openThu({ MaKH: kh.MaKH }); } },
      ] : []),
      ...(!isNew && isAdmin() ? [{ t: 'Xóa', ic: 'trash', cls: 'danger', fn: run(async () => {
        if (!confirm(`Xóa khách hàng ${kh.MaKH} – ${kh.TenKH}?`)) return;
        await api('xoaKhach', kh.MaKH);
        S.khach = S.khach.filter(k => k.MaKH !== kh.MaKH);
        closeModal(); render(); toast('Đã xóa khách hàng.');
      }) }] : []),
    ],
  });
  m.querySelectorAll('.box-b .tbl').forEach(t => { t.onclick = run(async e => {
    const tr = e.target.closest('[data-open]'); if (!tr) return;

    if (L === 'PT') openThu(S.thuTien.find(p => p.SoPT === so));
    else await openDoc(L, S[DOC[L].arr].find(x => x[DOC[L].key] === so));
  }); });
}

  });

// ===================== Soạn chứng từ: báo giá, đơn hàng, phiếu nhập, phiếu xuất =====================
const blankLine = type => ({ MaHH: '', TenHang: '', Model: '', DVT: '', XuatXu: '', SoLuong: '', LoaiGia: type || LG.le, DonGia: '' });
const lineFrom = h => Object.assign(blankLine(), { MaHH: h.MaHH, TenHang: h.TenHang, Model: h.Model, DVT: h.DVT, XuatXu: h.XuatXu, SoLuong: 1 });
const hangByMa = ma => ma ? S.hang.find(h => h.MaHH === ma) : null;
const lineTotal = l => Math.round((+l.SoLuong || 0) * (+l.DonGia || 0));
const filled = ls => ls.filter(l => String(l.TenHang).trim());
// Loại giá của dòng mới = loại sỉ/lẻ của dòng gần nhất phía trên
function lastType(before) {
  const ls = S.doc ? S.doc.lines.slice(0, before ?? S.doc.lines.length) : [];
  for (let i = ls.length - 1; i >= 0; i--) if (ls[i].LoaiGia !== LG.tuy && ls[i].MaHH) return ls[i].LoaiGia;
  return LG.le;
}
function ensureTail() {
  const ls = S.doc.lines;
  if (!ls.length || String(ls[ls.length - 1].TenHang).trim()) ls.push(blankLine(lastType()));
}
function setDirty(v) {
  S.dirty = v;
  if (S.view === 'doc') $('#title').textContent = docTitle() + (v ? ' •' : '');
  else if (S.view === 'hd') $('#title').textContent = hdTitle() + (v ? ' •' : '');
}
function docTitle() {
  const c = DOC[S.loai], d = S.doc;
  return d[c.key] ? `${c.ten} ${d[c.key]}` : S.loai === 'XK' && d.SoDH ? `Giao hàng cho đơn ${d.SoDH}` : c.ten + ' mới';
}

function newDoc(loai, init) {
  const base = { Ngay: today(), GhiChu: '', lines: [] };
  if (DOC[loai].price) Object.assign(base, { MaKH: '', TenKH: '', NguoiNhan: '', SDT: '', DiaChi: '', VAT: S.congTy.vatMacDinh ?? 8 });
  else Object.assign(base, { DoiTac: '', SoDH: '' });
  if (loai === 'DH') Object.assign(base, { NgayGiao: '', SoBG: '', TrangThai: '' });
  editDoc(loai, Object.assign(base, init || {}), {});
}
function editDoc(loai, doc, extra) {
  if (dangSoan() && !confirm('Chứng từ đang soạn chưa lưu. Bỏ thay đổi?')) return false;
  closeModal();
  S.loai = loai; S.doc = doc; S.extra = extra || {}; S.dirty = false;
  ensureTail();
  S.view = 'doc'; closeSide(); render(); window.scrollTo(0, 0);
  return true;
}
async function openDoc(loai, head) {
  if (!head) return;
  if (dangSoan() && !confirm('Chứng từ đang soạn chưa lưu. Bỏ thay đổi?')) return;
  const r = await api('layChungTu', loai, head[DOC[loai].key]);
  const goc = {}; // số lượng gốc của phiếu kho, để tính tồn khả dụng khi sửa phiếu xuất
  r.lines.forEach(l => { if (l.MaHH) goc[l.MaHH] = (goc[l.MaHH] || 0) + (+l.SoLuong || 0); });
  S.dirty = false;
  editDoc(loai, Object.assign({}, head, { lines: r.lines.map(l => Object.assign({}, l)) }), { daGiao: r.daGiao || {}, goc });
}
const openPK = p => p && openDoc(p.Loai === 'Nhập' ? 'NK' : 'XK', p);

  const numCol = ['SL', 'Số lượng', 'Đơn giá', 'Thành tiền', 'Đã giao', 'Tồn hiện tại', 'Có thể xuất'];
  const payCard = L === 'DH' && saved ? (() => {
    const pts = S.thuTien.filter(p => p.SoDH === d.SoDH), pks = S.phieuKho.filter(p => p.SoDH === d.SoDH);
    return `<div class="side-cards">
      <div class="card"><div class="card-h"><h3>Thu tiền</h3>${d.TrangThai !== 'Hủy' && conNo(d) > 0 ? '<a class="more" data-act="thu">+ Thu tiền</a>' : ''}</div><div class="card-b">
        <div class="stats" style="margin-top:0"><div class="stat"><div class="l">Tổng cộng</div><div class="v">${money(d.TongCong)}</div></div>
        <div class="stat"><div class="l">Đã thu</div><div class="v green">${money(daThu(d))}</div></div><div class="stat"><div class="l">Còn nợ</div><div class="v red">${money(conNo(d))}</div></div></div>
        ${miniTable(pts.map(p => `<tr data-go="pt:${esc(p.SoPT)}"><td><b>${esc(p.SoPT)}</b><span class="sub">${dmy(p.Ngay)} · ${esc(p.HinhThuc)}${p.GhiChu ? ' · ' + esc(p.GhiChu) : ''}</span></td><td class="num green"><b>${money(p.SoTien)} ₫</b></td></tr>`), 'Chưa thu tiền đơn này.')}</div></div>
      <div class="card"><div class="card-h"><h3>Giao hàng</h3>${d.TrangThai !== 'Hủy' && d.TrangThai !== 'Đã giao' ? '<a class="more" data-act="giao">+ Giao hàng</a>' : ''}</div><div class="card-b">
        ${miniTable(pks.map(p => `<tr data-go="pk:${esc(p.SoPK)}"><td><b>${esc(p.SoPK)}</b><span class="sub">${dmy(p.Ngay)}${p.GhiChu ? ' · ' + esc(p.GhiChu) : ''}</span></td><td class="num">${badge('Đã xuất kho', 'b-blue')}</td></tr>`), 'Chưa giao lần nào.')}</div></div>
    </div>`;
  })() : '';

  el.innerHTML = `<div class="card"><div class="doc-head">${head.join('')}</div>
    <div class="lines-wrap"><table class="lines"><thead><tr>${heads.map(([h, w]) => `<th class="${numCol.includes(h) ? 'num' : ''}"${w ? ` style="width:${w}px"` : ''}>${h}</th>`).join('')}<th style="width:44px"></th></tr></thead><tbody></tbody></table></div>
    <div class="doc-foot"><button class="btn sm" data-act="addline">${icon('plus')}Thêm dòng</button>
      <span class="hint">${price ? 'Gõ tên hoặc model để chọn hàng. Cột "Loại giá": chọn Giá sỉ / Giá lẻ để lấy giá từ bảng giá; tự sửa đơn giá thì tự chuyển sang Giá tùy chọn.' : 'Gõ tên hoặc model để chọn hàng, rồi nhập số lượng. Máy có IMEI/serial: gõ hoặc quét mã vào cột IMEI, mỗi máy một mã – số lượng tự đếm theo số mã.'}</span>
      ${price ? `<div class="totals"><div><span>Cộng tiền hàng</span><b data-t="TienHang"></b></div><div><span>Thuế GTGT (<span data-t="VATp"></span>%)</span><b data-t="TienVAT"></b></div>
        <div class="sum"><span>Tổng cộng</span><span data-t="TongCong"></span></div></div>` : `<div class="totals"><div class="sum"><span>Tổng số lượng</span><span data-t="SoLuong"></span></div></div>`}
    </div></div>${payCard}`;
  drawLines(el); drawTotals(el);

  el.onclick = run(async e => {
    const a = e.target.closest('[data-act]'), g = e.target.closest('[data-go]');
    if (g) {
      const [kind, so] = g.dataset.go.split(':');
      if (kind === 'pt') openThu(S.thuTien.find(p => p.SoPT === so));
      if (kind === 'pk') await openPK(S.phieuKho.find(p => p.SoPK === so));
      return;
    }
    if (!a) return;
    const act = a.dataset.act, b = S.doc;
    if (act === 'newkh') openKhach(null, pickKhach);
    else if (act === 'thu') openThu({ SoDH: b.SoDH });
    else if (act === 'giao') await giaoHang();
    else if (act === 'addline') { b.lines.push(blankLine(lastType())); drawLines(el); focusCell(el, b.lines.length - 1, 'TenHang'); }
    else if (act === 'rm') { b.lines.splice(+a.dataset.i, 1); ensureTail(); drawLines(el); drawTotals(el); setDirty(true); }
  });
  el.oninput = e => onDocInput(el, e.target);
  el.onchange = e => { if (e.target.dataset.f === 'LoaiGia') onTypeChange(el, e.target); };
  // Máy quét mã vạch gõ xong IMEI rồi Enter: thêm dấu phẩy để quét tiếp máy kế
  el.onkeydown = e => {
    const t = e.target;
    if (e.key !== 'Enter' || t.dataset.f !== 'IMEI') return;
    e.preventDefault();
    t.value = t.value.replace(/[\s,;]+$/, '') + ', ';
    onDocInput(el, t);
  };
}

function drawLines(el) {
  const L = S.loai, price = !!DOC[L].price, ls = S.doc.lines, n = ls.length;
  const da = Object.assign({}, S.extra.daGiao || {}); // phân bổ số đã giao lần lượt cho các dòng cùng mặt hàng
  const showGiao = L === 'DH' && S.doc.SoDH;
  $('tbody', el).innerHTML = ls.map((l, i) => {
    const name = `<td><input data-f="TenHang" value="${esc(l.TenHang)}" autocomplete="off"${i === n - 1 ? ' placeholder="Gõ tên / model để tìm hàng…"' : ''} aria-label="Tên hàng dòng ${i + 1}"></td>`;
    const rm = `<td><button class="icon-btn" data-act="rm" data-i="${i}" title="Xóa dòng" aria-label="Xóa dòng ${i + 1}">${icon('x')}</button></td>`;
    const txt = f => `<td><input data-f="${f}" value="${esc(l[f])}"></td>`;
    const qty = `<td><input data-f="SoLuong" class="num" type="number" min="0" step="any" value="${esc(l.SoLuong)}"></td>`;
    if (!price) {
      const t = l.MaHH ? tonOf(l.MaHH) + (L === 'XK' ? (S.extra.goc && S.extra.goc[l.MaHH]) || 0 : 0) : null;
      return `<tr data-i="${i}"><td class="c muted">${i + 1}</td>${name}${txt('Model')}${txt('DVT')}${qty}
        <td><input data-f="IMEI" value="${esc(l.IMEI)}" aria-label="IMEI hoặc serial dòng ${i + 1}"${i ? '' : ' placeholder="Mỗi máy một mã, cách nhau dấu phẩy"'}></td>
        <td class="c num" data-c="ton">${t === null ? '' : `<span data-av="${t}" class="${L === 'XK' && +l.SoLuong > t ? 'red' : ''}">${money(t)}</span>`}</td>${rm}</tr>`;
    }
    let giao = '';
    if (showGiao) {
      const k = l.MaHH || l.TenHang, g = Math.min(da[k] || 0, +l.SoLuong || 0);
      if (k) da[k] = (da[k] || 0) - g;
      giao = `<td class="c num">${l.TenHang ? `<span class="${g >= (+l.SoLuong || 0) ? 'green' : g ? 'warn' : 'muted'}">${money(g)}</span>` : ''}</td>`;
    }
    return `<tr data-i="${i}"><td class="c muted">${i + 1}</td>${name}${txt('Model')}${txt('DVT')}${txt('XuatXu')}${qty}
      <td><select data-f="LoaiGia" class="${l.LoaiGia === LG.tuy ? 'tuy' : ''}" aria-label="Loại giá dòng ${i + 1}">${Object.values(LG).map(v => `<option${v === l.LoaiGia ? ' selected' : ''}>${v}</option>`).join('')}</select></td>
      <td><input data-f="DonGia" class="num money" inputmode="numeric" value="${money(l.DonGia)}" aria-label="Đơn giá dòng ${i + 1}"></td>
      <td class="c num" data-c="ThanhTien">${l.TenHang ? money(lineTotal(l)) : ''}</td>${giao}${rm}</tr>`;
  }).join('');
}

function drawTotals(el) {
  const d = S.doc;
  if (!DOC[S.loai].price) { $('[data-t="SoLuong"]', el).textContent = money(sum(filled(d.lines), l => l.SoLuong)); return; }
  const tien = sum(d.lines, lineTotal), vat = +d.VAT || 0, tienVat = Math.round(tien * vat / 100);
  $('[data-t="TienHang"]', el).textContent = money(tien) + ' ₫';
  $('[data-t="VATp"]', el).textContent = vat;
  $('[data-t="TienVAT"]', el).textContent = money(tienVat) + ' ₫';
  $('[data-t="TongCong"]', el).textContent = money(tien + tienVat) + ' ₫';
}

function focusCell(el, i, f) { const c = $(`tr[data-i="${i}"] [data-f="${f}"]`, el); if (c) { c.focus(); if (c.select) c.select(); } }

// Giá khớp giá sỉ/lẻ của mặt hàng thì hiện đúng loại, còn lại là giá tùy chọn
function detectType(l) {
  const h = hangByMa(l.MaHH);
  if (!h || l.DonGia === '') return LG.tuy;
  if (h.GiaSi !== '' && +l.DonGia === +h.GiaSi) return LG.si;
  if (h.GiaLe !== '' && +l.DonGia === +h.GiaLe) return LG.le;
  return LG.tuy;
}

function updateRow(tr, l) {
  const sel = $('[data-f="LoaiGia"]', tr);
  if (sel) { sel.value = l.LoaiGia; sel.classList.toggle('tuy', l.LoaiGia === LG.tuy); }
  const tt = $('[data-c="ThanhTien"]', tr);
  if (tt) tt.textContent = l.TenHang ? money(lineTotal(l)) : '';
  const ton = $('[data-av]', tr);
  if (ton) ton.classList.toggle('red', S.loai === 'XK' && +l.SoLuong > +ton.dataset.av);
}

function onDocInput(el, t) {
  const d = S.doc;
  if (t.dataset.h) {
    d[t.dataset.h] = t.value;
    if (t.dataset.h === 'TenKH') {
      d.MaKH = ''; $('[data-ro="MaKH"]', el).textContent = 'Chưa chọn khách trong danh sách';
      showPicker(t, khachSource, pickKhach);
    }
    if (t.dataset.h === 'VAT') drawTotals(el);
    setDirty(true);
    return;
  }
  const tr = t.closest('tr[data-i]'), f = t.dataset.f;
  if (!tr || !f || f === 'LoaiGia') return;
  const i = +tr.dataset.i, l = d.lines[i];
  if (f === 'DonGia') { l.DonGia = parseMoney(t.value); l.LoaiGia = detectType(l); }
  else if (f === 'SoLuong') l.SoLuong = t.value === '' ? '' : +t.value;
  else l[f] = t.value;
  if (f === 'IMEI') { // số lượng đếm theo số mã đã nhập
    const n = t.value.split(/[\s,;]+/).filter(Boolean).length;
    if (n) { l.SoLuong = n; $('[data-f="SoLuong"]', tr).value = n; }
  }
  if (f === 'TenHang') {
    if (!t.value.trim()) l.MaHH = '';
    showPicker(t, hangSource, h => pickHang(i, h));
  }
  updateRow(tr, l); drawTotals(el); setDirty(true);
}

function onTypeChange(el, sel) {
  const tr = sel.closest('tr'), i = +tr.dataset.i, l = S.doc.lines[i];
  const h = hangByMa(l.MaHH);
  if (sel.value !== LG.tuy) {
    if (!h) { toast('Dòng này không có trong danh mục hàng, chỉ dùng được giá tùy chọn.', 'err'); sel.value = LG.tuy; }
    else {
      const p = sel.value === LG.si ? h.GiaSi : h.GiaLe;
      if (p === '') toast(`"${h.TenHang}" chưa có ${sel.value.toLowerCase()} – hãy nhập đơn giá.`, 'err');
      l.DonGia = p;
      $('[data-f="DonGia"]', tr).value = money(p);
    }
  }
  l.LoaiGia = sel.value;
  updateRow(tr, l); drawTotals(el); setDirty(true);
  if (l.LoaiGia === LG.tuy) focusCell(el, i, 'DonGia');
}

function pickHang(i, h) {
  const d = S.doc, l = d.lines[i], el = $('#view');
  if (DOC[S.loai].price) {
    const type = l.MaHH && l.LoaiGia !== LG.tuy ? l.LoaiGia : lastType(i);
    const p = type === LG.si ? h.GiaSi : h.GiaLe;
    Object.assign(l, { MaHH: h.MaHH, TenHang: h.TenHang, Model: h.Model, DVT: h.DVT, XuatXu: h.XuatXu, SoLuong: l.SoLuong || 1, LoaiGia: type, DonGia: p });
    if (p === '') toast(`"${h.TenHang}" chưa có ${type.toLowerCase()} – hãy nhập đơn giá.`, 'err');
  } else Object.assign(l, { MaHH: h.MaHH, TenHang: h.TenHang, Model: h.Model, DVT: h.DVT, XuatXu: h.XuatXu, SoLuong: l.SoLuong || 1 });
  ensureTail();
  drawLines(el); drawTotals(el); setDirty(true);
  focusCell(el, i, DOC[S.loai].price && l.DonGia === '' ? 'DonGia' : 'SoLuong');
}

function pickKhach(kh) {
  const d = S.doc, el = $('#view');
  Object.assign(d, { MaKH: kh.MaKH, TenKH: kh.TenKH, NguoiNhan: kh.NguoiLienHe || '', SDT: kh.SDT || '', DiaChi: kh.DiaChi || '' });
  el.querySelectorAll('[data-h]').forEach(i => { i.value = d[i.dataset.h] ?? ''; });
  $('[data-ro="MaKH"]', el).textContent = 'Mã khách: ' + kh.MaKH;
  setDirty(true);
}

// Cập nhật danh sách sau khi lưu/xóa: chứng từ, tồn kho, trạng thái đơn bị ảnh hưởng
function applyResult(r) {
  if (r.ton) S.ton = r.ton;
  if (S.q.baocao) S.q.baocao.hang = null;
  (r.donHang || []).forEach(dh => upsertLocal('donHang', 'SoDH', dh));
  sortAll(); derive();
}

let saving = false;
async function saveDoc(override) {
  if (saving) return;
  const L = S.loai, c = DOC[L], d = Object.assign({}, S.doc, override || {}), lines = filled(d.lines);
  if (!lines.length) throw new Error('Chưa có dòng hàng nào.');
  if (c.price) {
    if (!String(d.TenKH).trim()) throw new Error('Chọn hoặc nhập khách hàng.');
    if (lines.some(l => l.DonGia === '' || l.DonGia == null) && !confirm('Có dòng chưa có đơn giá (sẽ tính 0 ₫). Vẫn lưu?')) return;
  } else {
    if (lines.some(l => !(+l.SoLuong > 0))) throw new Error('Nhập số lượng lớn hơn 0 cho mọi dòng.');
    if (L === 'XK') {
      const thieu = lines.filter(l => l.MaHH && +l.SoLuong > tonOf(l.MaHH) + ((S.extra.goc && S.extra.goc[l.MaHH]) || 0));
      if (thieu.length && !confirm('Tồn kho không đủ cho: ' + thieu.map(l => l.TenHang).join(', ') + '.\nVẫn xuất kho (tồn sẽ âm)?')) return;
    }
  }
  saving = true;
  try {
    if (c.price && !d.MaKH) {
      if (confirm(`Khách "${d.TenKH}" chưa có trong danh sách khách hàng. Thêm vào danh sách?`)) {
        const kh = await api('luuKhach', { TenKH: d.TenKH, NguoiLienHe: d.NguoiNhan, SDT: d.SDT, DiaChi: d.DiaChi });
        upsertLocal('khach', 'MaKH', kh); d.MaKH = S.doc.MaKH = kh.MaKH;
      } else if (L === 'DH') throw new Error('Đơn hàng cần khách trong danh sách để theo dõi công nợ.');
    }
    const r = await api('luuChungTu', L, Object.assign({}, d, { lines }));
    const head = Object.assign({}, r.doc); delete head.lines;
    upsertLocal(c.arr, c.key, head);
    applyResult(r);
    const goc = {};
    r.doc.lines.forEach(l => { if (l.MaHH) goc[l.MaHH] = (goc[l.MaHH] || 0) + (+l.SoLuong || 0); });
    S.doc = Object.assign({}, head, { lines: r.doc.lines });
    S.extra = Object.assign({}, S.extra, { goc });
    S.dirty = false; ensureTail();
    render();
    toast(`Đã lưu ${c.ten.toLowerCase()} ${head[c.key]}.`);
  } finally { saving = false; }
}

async function chotDon() {
  const b = S.doc;
  if (S.dirty) throw new Error('Lưu báo giá trước khi chốt đơn.');
  if (!b.MaKH) throw new Error('Báo giá chưa gắn khách trong danh sách. Chọn khách, lưu rồi chốt đơn.');
  newDoc('DH', { SoBG: b.SoBG, MaKH: b.MaKH, TenKH: b.TenKH, NguoiNhan: b.NguoiNhan, SDT: b.SDT, DiaChi: b.DiaChi, VAT: b.VAT, GhiChu: b.GhiChu,
    lines: filled(b.lines).map(l => Object.assign({}, l)) });
  setDirty(true);
  toast('Đã chép báo giá sang đơn hàng. Điền ngày hẹn giao rồi bấm Lưu.');
}

async function giaoHang() {
  const d = S.doc;
  if (S.dirty) throw new Error('Lưu đơn hàng trước khi giao.');
  const left = Object.assign({}, S.extra.daGiao || {}), lines = [];
  filled(d.lines).forEach(l => {
    const k = l.MaHH || l.TenHang, g = Math.min(left[k] || 0, +l.SoLuong || 0);
    left[k] = (left[k] || 0) - g;
    const con = (+l.SoLuong || 0) - g;
    if (con > 0) lines.push({ MaHH: l.MaHH, TenHang: l.TenHang, Model: l.Model, DVT: l.DVT, XuatXu: l.XuatXu, SoLuong: con });
  });
  if (!lines.length) throw new Error('Đơn đã giao đủ.');
  newDoc('XK', { SoDH: d.SoDH, DoiTac: d.TenKH, GhiChu: d.DiaChi ? 'Giao tại: ' + d.DiaChi : '', lines });
  setDirty(true);
  toast('Kiểm tra số lượng giao lần này (sửa nếu giao một phần) rồi bấm Lưu.');
}

async function huyDon() {
  const d = S.doc, huy = d.TrangThai !== 'Hủy';
  if (S.dirty) throw new Error('Lưu hoặc bỏ thay đổi trước.');
  if (!confirm(huy ? `Hủy đơn ${d.SoDH}? Đơn hủy không tính vào doanh số và công nợ.` : `Khôi phục đơn ${d.SoDH}?`)) return;
  await saveDoc({ TrangThai: huy ? 'Hủy' : '' });
}

function copyDoc() {
  const b = S.doc;
  if (editDoc(S.loai, Object.assign({}, b, { SoBG: '', Ngay: today(), NguoiTao: '', NgayTao: '', NgaySua: '', lines: filled(b.lines).map(l => Object.assign({}, l)) }), {})) {
    setDirty(true);
    toast('Đã tạo bản sao – sửa rồi bấm Lưu để có số mới.');
  }
}

async function delDoc() {
  const L = S.loai, c = DOC[L], so = S.doc[c.key];
  if (!confirm(`Xóa ${c.ten.toLowerCase()} ${so}? Không thể hoàn tác.`)) return;
  const r = await api('xoaChungTu', L, so);
  S[c.arr] = S[c.arr].filter(x => x[c.key] !== so);
  applyResult(r);
  S.dirty = false; go(c.list);
  toast(`Đã xóa ${c.ten.toLowerCase()} ${so}.`);
}

// ===================== In chứng từ =====================
async function printDoc() {
  if (!S.doc[DOC[S.loai].key] || S.dirty) {
    await saveDoc();
    if (!S.doc[DOC[S.loai].key] || S.dirty) return;
  }
  await printHtml(docPrintHtml(S.loai, S.doc));
}
async function printHtml(html) {
  const p = $('#print');
  p.innerHTML = html;
  // chờ ảnh (mã QR) tải xong rồi mới in, tối đa 4 giây
  await Promise.all([...p.querySelectorAll('img')].map(i => i.complete ? null : new Promise(r => { i.onload = i.onerror = r; setTimeout(r, 4000); })));
  window.print();
}

function letterhead(title) {
  const c = S.congTy;
  return `<div class="p-head"><div class="p-co">${esc(c.ten)}</div><div><i>${esc(c.khauHieu)}</i></div>${(c.diaChi || []).map(x => `<div>${esc(x)}</div>`).join('')}<div>${esc(c.lienHe)}</div></div><h1>${title}</h1>`;
}
const infoTable = rows => `<table class="p-info">${rows.map(r => `<tr>${r.map((x, i) => `<td>${i % 2 ? esc(x) : x}</td>`).join('')}</tr>`).join('')}</table>`;
const signs = list => `<div class="p-sign">${list.map(s => `<div>${s}<i>(Ký, ghi rõ họ tên)</i></div>`).join('')}</div>`;

function docPrintHtml(L, d) {
  const c = S.congTy, lines = filled(d.lines);
  if (!DOC[L].price) {
    const bh = L === 'XK' && lines.some(l => l.HetHan); // phiếu giao có hàng còn bảo hành: dùng luôn làm phiếu bảo hành
    const title = L === 'NK' ? 'PHIẾU NHẬP KHO' : !d.SoDH ? 'PHIẾU XUẤT KHO' : bh ? 'PHIẾU GIAO HÀNG KIÊM PHIẾU BẢO HÀNH' : 'PHIẾU XUẤT KHO – GIAO HÀNG';
    return `<div class="p-page">${letterhead(title)}
      ${infoTable([['Số phiếu:', d.SoPK, 'Ngày:', dmy(d.Ngay)], [L === 'NK' ? 'Nhà cung cấp:' : 'Người nhận:', d.DoiTac, d.SoDH ? 'Theo đơn hàng:' : '', d.SoDH || ''], ['Ghi chú:', d.GhiChu, '', '']])}
      <table class="p-lines"><thead><tr><th>STT</th><th>Tên hàng hóa</th><th>Model</th><th>ĐVT</th><th>Số lượng</th><th>IMEI / Serial</th>${bh ? '<th>Bảo hành đến</th>' : ''}</tr></thead>

const P = { input: null, items: [], idx: 0, onPick: null };
function hangSource(q) {

  return S.hang.filter(h => matches(w, h, hangText)).slice(0, 50).map(h => ({ item: h,
    html: `<b>${esc(h.TenHang)}</b><small>${esc([h.MaHH, h.Model, h.XuatXu].filter(Boolean).join(' · '))} — Sỉ ${money(h.GiaSi) || '—'} · Lẻ ${money(h.GiaLe) || '—'}${S.ton[h.MaHH] ? ' · Tồn ' + money(tonOf(h.MaHH)) : ''}</small>` }));
}
function khachSource(q) {
  const w = words(q);
  return S.khach.filter(k => matches(w, k, khachText)).slice(0, 30).map(k => ({ item: k,
    html: `<b>${esc(k.TenKH)}</b><small>${esc([k.MaKH, k.SDT, k.DiaChi].filter(Boolean).join(' · '))}</small>` }));
}
function showPicker(input, source, onPick) {
  const box = $('#picker');
  P.items = input.value.trim() ? source(input.value) : [];
  P.input = input; P.onPick = onPick; P.idx = 0;
  if (!P.items.length) return hidePicker();
  box.innerHTML = P.items.map((it, i) => `<div data-i="${i}" class="${i ? '' : 'on'}">${it.html}</div>`).join('');
  box.classList.remove('hidden');
  const r = input.getBoundingClientRect(), w = Math.min(Math.max(r.width, 380), innerWidth - 8);
  box.style.width = w + 'px';
  box.style.left = Math.max(4, Math.min(r.left, innerWidth - w - 4)) + 'px';
  box.style.top = (r.bottom + box.offsetHeight + 4 > innerHeight && r.top > box.offsetHeight ? r.top - box.offsetHeight - 4 : r.bottom + 4) + 'px';
}
function hidePicker() { $('#picker').classList.add('hidden'); P.input = null; }
function choose(i) { const it = P.items[i], fn = P.onPick; hidePicker(); if (it) fn(it.item); }
document.addEventListener('keydown', e => {
  if (!P.input || e.target !== P.input) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    P.idx = (P.idx + (e.key === 'ArrowDown' ? 1 : -1) + P.items.length) % P.items.length;
    $('#picker').querySelectorAll('[data-i]').forEach((d, i) => d.classList.toggle('on', i === P.idx));
    $('#picker .on').scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') { e.preventDefault(); choose(P.idx); }
  else if (e.key === 'Escape') { e.stopPropagation(); hidePicker(); }
}, true);
$('#picker').addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); choose(+d.dataset.i); } });
document.addEventListener('focusout', e => { if (e.target === P.input) setTimeout(() => { if (document.activeElement !== P.input) hidePicker(); }, 150); });
window.addEventListener('scroll', e => { if (e.target !== $('#picker')) hidePicker(); }, true);

const HD_BEN_A = ['TenDN', 'DiaChi', 'VanPhongGD', 'MST', 'NguoiDaiDien', 'ChucVu', 'SDT', 'SoTK', 'NganHang'];
function hanHD(h) { // hợp đồng đang hiệu lực đã quá hạn / sắp hết hạn, còn lại null
  if (h.TrangThai !== 'Đang hiệu lực' || !h.NgayHetHan) return null;
  const n = Math.round((Date.parse(h.NgayHetHan) - Date.parse(today())) / 864e5);
  return n < 0 ? { het: true, n: -n } : n <= HD_SAP ? { sap: true, n } : null;

}
