# Tự triển khai web app lên Google Apps Script mỗi khi main có code mới (gộp PR), link giữ nguyên.
# Cần một lần: secret CLASPRC_JSON = nội dung file .clasprc.json sau khi chạy "clasp login" trên máy (xem HUONG_DAN.md, mục "Tự triển khai khi gộp PR").
# Chạy tay: tab Actions → Triển khai Apps Script → Run workflow.
name: Triển khai Apps Script

on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.clasp.json', '.github/workflows/trien-khai.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency: # hai lần gộp sát nhau: chạy lần lượt, không chồng lên nhau
  group: trien-khai
  cancel-in-progress: false

jobs:
  trien-khai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @google/clasp@3.4.1
      - name: Đăng nhập clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Chưa có secret CLASPRC_JSON (Settings → Secrets and variables → Actions). Xem HUONG_DAN.md, mục \"Tự triển khai khi gộp PR\"."
            exit 1
          fi
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
      - name: Kiểm tra, đẩy code, tạo bản triển khai mới
        run: node dev/trien-khai.js
      - name: Xóa thông tin đăng nhập
        if: always()
        run: rm -f ~/.clasprc.json
